[package]
name = "glyph-font"
version = "0.1.0"
edition = "2021"
description = "Fonts loaded at run time and encoded to Slug curves in the engine's atlas format (the wall)."

[dependencies]
icu_normalizer = { version = "2.3", default-features = false, features = ["compiled_data"] }
term-cells = { path = "../term-cells" }
ttf-parser = "0.25"

[lints]
workspace = true
