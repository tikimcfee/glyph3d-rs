[package]
name = "termd-client"
version = "0.1.0"
edition = "2021"
description = "A client for g3d-termd's socket protocol: frames, requests, and a reader thread that hands a host the terminals' bytes and events (the wall)."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
glyph-vt = { path = "../glyph-vt" }
term-cells = { path = "../term-cells" }

[lints]
workspace = true
