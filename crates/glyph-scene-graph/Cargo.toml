[package]
name = "glyph-scene-graph"
version = "0.1.0"
edition = "2021"
description = "The renderer's transform tree: pooled nodes behind generation handles, CPU-owned topology in depth-first order, dirty tracking, and a CPU resolve of world transforms over the dirty depth-first ranges only."

# Step 1 of out/DESIGN-VIEWS-AND-TRANSFORMS-2026-10-10.md (§ "Groups: a pooled
# transform tree"). The crate knows nothing of glyphs or devices: the renderer
# maps its group rows onto nodes (native/src/glyph_scene/nodes.rs), resolves
# a frame here, and uploads the rows it derives from the resolved nodes by the
# plan `upload.rs` chooses. (Until 2026-10-26 the resolve was a wgpu compute
# pass in this crate.)
[dependencies]
bytemuck = { version = "1", features = ["derive"] }

[[bin]]
name = "resolve-bench"
path = "src/bin/resolve_bench.rs"

[lints]
workspace = true
