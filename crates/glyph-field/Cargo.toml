[package]
name = "glyph-field"
version = "0.1.0"
edition = "2021"
description = "The glyph field's mode-neutral contract: the GlyphField trait every render mode implements, the field mode enum, and the records and GPU resources the modes share."

# The contract crate owns no shader and no slot format. A render mode
# (`glyph-field-derived`; `glyph-field-instanced` until 2026-10-31) owns its own slot record,
# transcode, WGSL and pipelines, and implements `GlyphField` so the scene can
# draw and edit glyphs without knowing which mode it holds. The slot storage
# and host upload live here, generic over the mode's slot (C1, 2026-10-09);
# rayon is the upload's parallel transcode; its Metal direct-upload path
# reaches `wgpu::hal` (wgpu's default features carry the Metal backend on
# macOS, exactly as native relies on).
[features]
default = ["wgpu"]
# The field's draw on a wgpu device (`GlyphFieldGpu`, the slot storage, the
# shared pipelines and bindings). Off, the crate is the field's host side
# alone, for a host with its own renderer (2026-10-31).
wgpu = ["dep:wgpu"]

[dependencies]
wgpu = { version = "30", optional = true }
bytemuck = { version = "1", features = ["derive"] }
encase = "0.12"
rayon = "1.10"
# Optional: `GlyphFieldMode` as a clap `ValueEnum`, so the renderer's
# `--field-mode` and its launcher read the mode names and help from one derive.
clap = { version = "4", features = ["derive"], optional = true }

[lints]
workspace = true
