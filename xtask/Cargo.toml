[package]
name = "xtask"
version = "0.1.0"
edition = "2021"
publish = false

# DELIBERATELY NOT a workspace member, and not a workspace root.
#
# `native/Cargo.toml` is a standalone package. Making it a member of a root
# workspace would relocate its target directory from native/target to
# ./target, and eight paths depend on the current location — build.toml's
# `renderer` artifact and `pixel-baselines` inputs, the content-hash stamp dir
# (native/target/.glyph-stamps/), and the check scripts. That move is a real
# change disguised as a layout tidy, so it is not being made here. This crate
# keeps its own target/ and reaches the repo through paths, not through cargo.

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
