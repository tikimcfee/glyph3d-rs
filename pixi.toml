[workspace]
authors = ["Ivan Lugo <ivan.lugo.dev@pm.me>"]
channels = ["https://conda.modular.com/max-nightly", "https://conda.modular.com/max", "conda-forge"]
name = "glyph3d-native"
platforms = ["osx-arm64", "linux-64"]
version = "0.1.0"

# The artifact/gate graph is declared in build.toml and executed by
# `glyph` (glyph/src/main.rs). These tasks are thin doors onto it, plus the
# generators; the one thing pixi supplies that nothing else does is the
# fontTools env the emoji generators run in (build.toml's emoji-sheet check).
[tasks]
glyph = "cargo glyph"
build = "cargo glyph build"
check = "cargo glyph test"
check-all = "cargo glyph test"
verify = "cargo glyph test --frozen"
prove = "cargo glyph prove"
gen-trie = "python3 tools/gen_real_trie.py"
gen-schema = "python3 tools/gen_schema.py"
check-gen = { cmd = "python3 tools/gen_real_trie.py --verify-only && python3 tools/gen_schema.py --check" }
# The emoji tools read the vendored colour font with fontTools, which lives in
# THIS env (pinned below) rather than whatever the host's python3 has.
emoji-inventory = "python tools/emoji_inventory.py"
gen-emoji-sheet = "python tools/gen_emoji_sheet.py"

[dependencies]
# Capped WITHIN the 26.6/1.1 stable family: a deliberate `pixi update` may move
# inside it but cannot sail to the 26.7/1.2 nightly line (max-nightly is listed
# first, so an uncapped range resolves there — that line removes MutStringSpan
# and friends; pure churn for this tree, see out/TOOLCHAIN-BUMP-2026-09.md).
mojo = ">=1.1.0,<1.2"
max = ">=26.6,<26.7"
# For tools/emoji_font.py (the CBDT/CBLC walker behind the emoji sheet). Only
# tables and verbatim PNG bytes are read through it, so its version cannot
# change an artifact — but it is pinned to a major so a solve stays boring.
fonttools = ">=4.63,<5"

# Both platforms carry an EXACT mojo/max pin so that adding an unrelated
# dependency (fonttools, 2026-09-10) re-solves to the same toolchain the suites
# were verified against. The ranges above are what a deliberate `pixi update`
# moves; these are what an incidental solve may not.
# 2026-09-24: bumped from the dev2026083005 nightly to the stable cut of the
# same family (out/TOOLCHAIN-BUMP-2026-09.md).
[target.osx-arm64.dependencies]
mojo = "==1.1.0"
max = "==26.6"

# linux-64 was added 2026-09-07 and solved fresh; without an exact pin it would
# have taken the newest nightly, not the build the suites were verified against
# (engine/TOOLCHAIN.md tracks the import-surface state). Pinned to the same
# toolchain the osx-arm64 lock names.
[target.linux-64.dependencies]
mojo = "==1.1.0"
max = "==26.6"
