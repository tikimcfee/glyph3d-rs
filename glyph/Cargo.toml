[package]
name = "glyph"
version = "0.1.0"
edition = "2021"
publish = false

# The build/test tool. `cargo glyph <verb>` from anywhere in the workspace.
#
# It is a workspace member on purpose: it is built and tested by the same cargo
# invocation as the renderer, which means it is subject to the same
# zero-warning gate and the same test floor as the code it checks. A build tool
# exempt from its own regime is how tools/glyph.py ended up with no tests.

[dependencies]
# Standard tools rather than hand-rolled equivalents: clap for the CLI surface,
# serde+toml for the manifest, glob for input expansion, sha2 for the
# content-hash stamps that tell a product from a stale one.
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
glob = "0.3"
sha2 = "0.10"
# `glyph drift`: decode this host's renders and another platform's golden set
# to say how far apart two rasterizers are. Already in the lock via `image`.
png = "0.18"
