[package]
name = "glyph3d-native"
version = "0.1.0"
edition = "2021"
description = "Stage A: native wgpu shell for the million-glyph code-visualization port"

# The lib target exists so the Zed-integration experiment can link the
# renderer into the experiment workspace (one binary, one lock there — the
# gated repo build never sees Zed's graph). See
# zed_integration_experiments/docs/seam.md.
[lib]
path = "src/lib.rs"

[dependencies]
# Latest stable wgpu (v30.x). Let cargo resolve within the major line.
wgpu = "30"
winit = "0.30"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
env_logger = "0.11"
log = "0.4"
image = "0.25"
# Stage I: 0.30 → 0.33 bump (its own gated mini-stage — see out/STAGE_I_REPORT.md).
# Feature flags from Stage H carried over; all three names verified to still
# exist in the published 0.33.6 manifest (docs.rs/crate/glam/0.33.6/features):
#   approx            — epsilon-compare traits for oracle-style tests (additive
#                       trait impls; existing bit-exact compares stay the standard)
#   debug-glam-assert — extra validation asserts in debug builds only
#   mint              — interop shim for future math-typed crates
# 0.33.2 moved look_at/look_to/perspective off the matrix types into
# glam::camera::{rh,lh}::{view,proj::*} free functions (old methods deprecated);
# call sites use the WebGPU-convention directx projection module.
glam = { version = "0.33", features = ["approx", "debug-glam-assert", "mint"] }
# Stage H: real CLI (generated --help/errors/completions) replacing the
# hand-rolled parser. Op-stream interleaving order is preserved via clap
# occurrence indices — see build_ops() and the parity tests in main.rs.
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
wgpu-profiler = "0.28"
encase = "0.12"
# Stage K (K1): egui overlay on the WINDOWED renderer (windowed.rs only;
# offscreen never touches it). egui-wgpu WITHOUT its `winit` feature — that
# pulls in Painter, which owns the surface and clears the frame; we own the
# surface/event loop/present and drive egui_wgpu::Renderer directly.
# egui-wgpu depends on wgpu 30 with default-features = false, so our own wgpu
# entry keeps sole control of backend selection and the tree unifies to one
# wgpu (verified by `cargo tree -i wgpu`). egui 0.36 MSRV is rustc 1.95.
egui = { version = "0.36", optional = true }
egui-winit = { version = "0.36", optional = true }
egui-wgpu = { version = "0.36", optional = true }

[features]
default = ["egui-ui"]
# Stage K: build the windowed egui overlay. With the feature off (or `--no-ui`
# at runtime) windowed behavior is exactly pre-K.
egui-ui = ["dep:egui", "dep:egui-winit", "dep:egui-wgpu"]

[dev-dependencies]
# Stage H: validate the hand-written WGSL in `cargo test` with the exact
# compiler wgpu 30 bundles (naga 30.0.1 is already in the tree via wgpu, so
# version pairing is automatic). Test-only — never ships in release bins.
naga = { version = "30", features = ["wgsl-in"] }
