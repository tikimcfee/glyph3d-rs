# The workspace root.
#
# `native/` (the renderer) and `glyph/` (the build/test tool) were two
# disconnected crates until 2026-09-06. That cost more than tidiness:
# rust-analyzer saw two unrelated projects, so neither had the other in scope,
# and the tool that manages the build could not be built or tested by the same
# invocation as the thing it manages.
#
# One workspace, one target/ directory, one Cargo.lock. The move relocated
# target/ from native/target to ./target; every path that depended on the old
# location was updated in the same commit — build.toml, the content-hash stamp
# dir, the check scripts, and the docs.
[workspace]
resolver = "2"
members = ["native", "glyph", "crates/glyph-field", "crates/glyph-field-derived", "crates/glyph-scene-graph", "crates/definition-engine"]
# The Zed-integration experiments are their OWN workspace
# (experiments/Cargo.toml) where native's deps and Zed's graph unify in one
# lock seeded from Zed's. `exclude` keeps directory-walking from claiming
# them (and their Zed-path deps) for THIS workspace — the gated build never
# sees Zed. See zed_integration_experiments/docs/seam.md. `makepad` is the
# makepad host, its own workspace too (makepad/Cargo.toml says why).
exclude = ["experiments", "makepad"]

# The one place lint levels are set (2026-10-11); every member opts in with
# `[lints] workspace = true`. cargo-build and cargo-clippy are zero-warning
# gates, so a lint at "warn" here is red until its last site is fixed: each
# lint arrives in the same commit as all of its fixes, never as a standing
# warning. Not the cast lints: they fight the f32/u32 index maths everywhere.
[workspace.lints.rust]

[workspace.lints.clippy]
# Every #[allow] says why, in the attribute where rustc carries it (2026-10-11).
allow_attributes_without_reason = "warn"
# #[expect] over #[allow]: an expectation the lint stops meeting is itself a
# warning, so a suppression cannot outlive its cause (2026-10-11).
allow_attributes = "warn"
# Every unsafe block and impl states the invariant it relies on, checked on
# Linux and, cross-target, on macOS, whose Metal path is cfg-gated (2026-10-11).
undocumented_unsafe_blocks = "warn"

[profile.release]
# Fast edit loops (2026-11-01): measured on both hosts, each landing on these
# same three, every golden byte-equal. One-line edit to `cargo glyph test
# --inner`: monolith1 29 -> 13 s, IL-Air-M2 75-109 -> 14-15 s (the rebuild
# inside it 62-96 -> 3-4 s). Line tables keep backtraces and profilers
# usable; full debug info for a debugger is CARGO_PROFILE_RELEASE_DEBUG=true.
# Rejected there: -Zthreads, target-cpu=native, debug = false, packed or no
# split debuginfo, dependencies at opt-level 1, fewer jobs.
incremental = true
debug = "line-tables-only"
lto = "off"
