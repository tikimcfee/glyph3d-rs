# glyph3d defaults — every named, tunable value the renderer and UI read.
#
# Compiled into the binary (native/src/config.rs, include_str!). COMPLETE by
# contract: every key here is required, so deleting one is a parse failure,
# not a silent zero. Override any of them, per key, in a [section] of your
# launch_config.toml (see launch_config.example.toml); unknown sections and
# keys are errors.
#
# Contracts are NOT here — layout metrics, slot/atlas formats, anything a
# reference check was computed against. See .agents/rules/rust-engineering.md
# section 10 for the line between the two.
#
# Every golden view renders with exactly these values. Changing one here is a
# re-baseline; say so in the commit.
#
# Colors are RGBA in 0.0-1.0, handed to the consuming pass as-is.

[glyph_scene]
# What the glyph field pass clears to (behind every file).
clear_color = [0.07, 0.07, 0.09, 1.0]
# File card background when --file-backgrounds is on and no colour was given
# on the command line or as the launch key file_bg_color.
file_bg_color = [0.10, 0.10, 0.13, 0.85]
# Selection tint over the picked glyphs / file in windowed runs: RGB, and A
# as its strength (a coverage-weighted tint that keeps the glyph readable).
selection_tint = [1.0, 0.85, 0.25, 0.45]

[lod]
# Every threshold here is "px per text row": how many on-screen pixels tall a
# row of text appears (a row is one em cell, 1.0 world unit). Fixed values,
# never adapted to the camera. The Debug panel moves them live (windowed only;
# offscreen and every gate keep these) and keeps them ordered
# text_detail_px >= show_glyphs_px >= visible_backdrop_px, so glyphs appear
# fuzzed and sharpen on approach (C26, 2026-10-10).
#
# "Show glyphs": at or above this a file segment is drawn glyph by glyph;
# below it the segment draws its backdrop quad instead (in --field-mode
# visible, a line below it is a wash). Below 1 px/em glyphs are raster-lottery
# subpixel blobs; the backdrop (mean ink colour x coverage) is the visually
# equivalent form. Never substitutes at >= 1 px/em, so legible text is always
# drawn glyph by glyph. Default for --show-glyphs-px. Was `min_px` until C26;
# the old key still merges from a launch_config.toml [lod] section.
show_glyphs_px = 1.0
# "Text detail": at or above this glyphs render with full curve detail; below
# it the shader fuzzes their windings progressively (greeking: fewer ALU ops,
# no moiré) — smoothly with --greek-smooth, as a hard cut by default. Default
# for --text-detail-px; 10.0 was the compiled literal before C26.
text_detail_px = 10.0
# Backdrop alpha = ink fraction x gain. Fitted against the pre-LOD full-field
# render: 0.7 matches its mean linear pixel value within ~3% (1.9 overshot
# +45%, 1.3 +29%, 1.0 +17%). See out/history/STAGE_F_REPORT.md.
backdrop_gain = 0.7
# --field-mode visible only (M2, out/VISIBLE-MODE.md): below this a whole item
# is one backdrop rectangle. Lines between this and show_glyphs_px are washes
# (one quad per line in the item's tint); at or above show_glyphs_px they are
# laid out as glyphs. The panel's "File rectangle" handle under "Show glyphs".
# The other field modes never read it.
visible_backdrop_px = 0.25

[camera]
# Vertical field of view, degrees, every camera mode.
fov_y_deg = 40.0
# Front framing: fit distance = half-extent / tan(fov/2) x margin + pad.
frame_margin = 1.08
frame_pad = 2.0
# Fly mouse-look, radians per pixel of mouse motion.
look_sensitivity = 0.0022
# Fly speed at start and its scroll range, as fractions of the fit distance.
fly_speed = 0.4
fly_speed_min = 0.005
fly_speed_max = 8.0
# Fly speed multiplier per scroll line.
fly_scroll_step = 1.15
# Fly velocity damping rate (1/s): ~63% of the way to the target speed every
# 1/rate seconds (10.0 = every 100 ms).
fly_damping = 10.0
# Fly near plane (world units), kept small for single-glyph close-ups.
fly_near = 0.05
# Fly far plane = distance to field center + fit x fly_far_fit, clamped to
# [fly_far_min, fly_far_max] to keep f32 depth precision from collapsing.
fly_far_fit = 4.0
fly_far_min = 20000.0
fly_far_max = 100000.0
# Fly pitch limit, radians either side of level (just short of straight up
# or down, where yaw would degenerate).
fly_pitch_limit = 1.55
# Front and orbit cameras: near = distance x fraction, far = distance x factor.
front_near_fraction = 0.01
front_far_factor = 20.0
# Orbit camera (legacy windowed demo): radius in fit distances, angular rate in
# rad/s, and eye height as a fraction of the radius.
orbit_radius_fit = 1.05
orbit_rate = 0.12
orbit_height_fraction = 0.18

[repo]
# Per-directory group tints, multiplied with the syntax colours (bright
# pastels: the hue groups a directory's pages without drowning the palette).
# A directory hashes to one entry; the tint-cycle verb walks this list.
dir_tints = [
    [1.00, 1.00, 1.00],
    [1.00, 0.93, 0.87],
    [0.88, 1.00, 0.92],
    [0.88, 0.95, 1.00],
    [1.00, 0.91, 1.00],
    [0.95, 1.00, 0.88],
    [1.00, 0.97, 0.86],
    [0.92, 0.92, 1.00],
    [0.90, 1.00, 1.00],
    [1.00, 0.88, 0.88],
]
# Far-LOD backdrop tint for an extension no [[repo.extension_tints]] lists.
extension_tint_fallback = [0.75, 0.75, 0.75]   # neutral grey

# Far-LOD backdrop tint by file extension (flat colour mode). The first entry
# listing an extension wins.
[[repo.extension_tints]]
extensions = ["rs"]
tint = [0.85, 0.40, 0.20]   # Rust orange
[[repo.extension_tints]]
extensions = ["js", "mjs", "cjs"]
