# Glyph3D Launch Configuration — EXAMPLE
#
# Copy to `launch_config.toml` (gitignored; personal) and edit for this machine:
#
#     cp launch_config.example.toml launch_config.toml
#
# Startup defaults for interactive windowed runs. The renderer reads it from the
# repo root or native/, or from --launch-config <path>; the `cargo glyph`
# launcher TUI reads it from the working directory or the repo root. Any CLI
# flag overrides a setting here, and a `--screenshot` run (every gate) never
# reads the file. Unknown keys are errors. Values below DIFFER from the CLI
# defaults where marked.
#
# Top-level keys below are launch options. [section] tables override the
# compiled settings in config/defaults.toml, key by key — see the end of file.

# Render file card background bounding surfaces behind glyph fields
file_backgrounds = true

# File card background RGBA color [red, green, blue, alpha] (normalized 0.0 to 1.0)
file_bg_color = [0.10, 0.10, 0.13, 0.85]

# Macro LOD threshold in on-screen px/em (default: 1.0).
# Below this threshold, distant files collapse into an LOD backdrop quad.
lod_min_px = 1.0

# Greeking / Moiré suppression (default: true).
# Smooths subpixel glyphs (< 5px) into stable horizontal ink bars,
# eliminating high-frequency sparkling, strobing, and aliasing during flight.
greeking = true

# Wrap layout mode: "back" (Z-staircase), "down" (vertical columns), etc.
wrap_mode = "back"

# Z-step spacing between wrapped columns in units of em cell height (default: 0.15)
z_wrap_spacing = 0.15

# Sequence clustering mode: "cluster" (full grapheme cluster resolution) or "leader"
cluster_mode = "cluster"

# Syntax color mode on repo load: "syntax" (CPU lexer) or "flat" (geometry only)
color_mode = "flat"

# Layout engine backend: "hyper" (parallel CPU Rayon, default), "direct" or "batch"
repo_engine = "hyper"

# Glyph field render mode: "derived" (compact 20B slots, zero-copy) or "instanced" (32B slots).
# DIFFERS from the CLI default, which is "instanced".
field_mode = "derived"

# Debug flags
no_cull = false
no_ui = false

# Default repository to open if none specified on CLI (optional)
# load_repo = "native/fixtures/g-pick-repo"

# Repos the launcher TUI cycles through with ◄/► (optional). Without this the
# launcher offers "." and "native/fixtures/g-pick-repo". Add your own corpora.
# repo_presets = [".", "native/fixtures/g-pick-repo", "~/src/some-large-repo"]

# Default agent session transcript path to load at startup (optional)
# agent_session = "~/.claude/projects/<project-slug>/<session-id>.jsonl"

# Agent session discovery (optional). Per app: a path set here is the ONLY
# place scanned for that app; "" turns the app off; unset uses the app's own
# default locations that exist on this machine (the same home-relative paths
# on macOS, Linux and Windows):
#   claude       $CLAUDE_CONFIG_DIR/projects, else ~/.claude/projects
#   antigravity  ~/.gemini/antigravity/brain (desktop app)
#                ~/.gemini/antigravity-cli/brain (CLI)
#   kimi         ~/.kimi-code/sessions
# The F7 session browser and the launcher both print what they scanned.
# claude_projects_dir = "~/.claude/projects"
# antigravity_brain_dir = "~/.gemini/antigravity/brain"
# kimi_sessions_dir = ""

# ── Settings overrides ───────────────────────────────────────────────────────
# Any key from config/defaults.toml, under its own [section]. Only the keys you
# set are overridden; the rest keep their compiled defaults.
#
# [glyph_scene]
# clear_color = [0.07, 0.07, 0.09, 1.0]
#
# [environment]
# mode = "ground"          # ground plane + sky; the B key toggles it live
# ground_color = [0.034, 0.042, 0.060]
