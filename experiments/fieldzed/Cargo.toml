# fieldzed — P1c: Zed's language stack AND the glyph renderer in ONE binary.
# The provider thread runs a headless gpui App over real language::Buffers,
# computes One Dark style runs, and ships seam::SurfaceUpdate envelopes over
# a channel; the main thread links glyph3d-native, builds the repo scene,
# applies the envelopes (version law enforced by the renderer), renders
# offscreen. The sidecar FILE is dead.
[package]
name = "fieldzed"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
glyph3d-native = { path = "../../native" }
pollster = "0.4"
wgpu = "30"
gpui = { path = "../zed/crates/gpui", features = ["test-support"] }
language = { path = "../zed/crates/language", features = ["test-support"] }
grammars = { path = "../zed/crates/grammars" }
# debug-embed: features do NOT unify across sibling packages — zedspike
# enabling it does nothing for THIS binary. Without it, zed's fs_embed!
# locates grammar assets by walking the EXE's ancestors for a .git (finds
# this worktree, panics "missing config"). Same landmine, second binary.
util = { path = "../zed/crates/util", features = ["debug-embed"] }
theme = { path = "../zed/crates/theme" }
syntax_theme = { path = "../zed/crates/syntax_theme" }
# MUST be zed's git fork (same rev as the workspace patch table) — the Node
# type this walks is the fork's; a crates.io tree-sitter would be a second,
# incompatible crate in the graph.
tree-sitter = { git = "https://github.com/tree-sitter/tree-sitter", rev = "43623ec9bf0eaaf7113285c46e8a09018f181b18" }
tree-sitter-rust = "0.24.2"
