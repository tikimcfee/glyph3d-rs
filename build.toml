why = "a read's beat showing the revision engine's text in place of the lines the event says the call read: with no engine (or a partial read, which is no revision) the card says nothing was recorded, and with one it shows the whole file, not what the agent saw. CONSUMED BY: types::AgentSession::linearize_events's FileRead arm; reddens agent_transcript::tests::agy_and_kimi_reads_use_their_file_text_not_the_disk (the beat's content)"
file = "native/src/agent_transcript/types.rs"
op = "replace"
find = "                                    Some(f) => Some(f.text.clone()),\n                                    None => revision_text(&record.file_path),\n                                },\n                                first_line"
with = "                                    Some(_) => revision_text(&record.file_path),\n                                    None => revision_text(&record.file_path),\n                                },\n                                first_line"
expect = "agy_and_kimi_reads_use_their_file_text_not_the_disk"
