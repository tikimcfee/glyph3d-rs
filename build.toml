# HyperLayout — the production engine — against the oracle-backed fold.
# Red from 2026-10-09 (C10, C13, C14 in out/MAINTENANCE-NOTES-2026-10-08.md)
# until the C10/C13 fix the same day. The three fixtures that set
# scroll_rows / page_cols were split out to a red `hyper-oracle-paged` gate
# while C14 (both Pass 2 paths paginated them unlike the fold) was open; C14
# is fixed (dd6fe01) and they are back here, with the paged gate deleted.
# g-pick-repo (every repo golden's corpus: wide.txt is cut inside its long
# line) and chunk-cut.txt (built for the intra-line cut classes, C15) joined
# both runs with the C15 fix (c35770e).
# The second invocation is the leader-mode run (C13's volume class): the same
# corpora with every item in leader mode, so a mode that leaks is red on
# 319,628 records rather than the 12 of cluster-zwj's leader item.
# The third and fourth are the TAB-STOP runs (2026-10-11, `fold::TabWidth`):
# --tab-width 4 (strict, cluster mode) over the tab-stops fixture, with
# g-cluster-repo and g-pick-repo (no tabs: wide.txt's chunk cuts under a stop
# wider than a cell), then --tab-width 8 in leader mode over tab-stops (8
# reaches tabs of 5 and 7 cells, whose `f32(k) x cell` rounds). No oracle has
# tab stops: past one cell the reference is this tree's serial fold, held to
# text::reference_layout and to the oracle-backed one-cell fold over the
# spaces a tab stands for by fold::tests. Both runs refuse a corpus in which
# no tab spanned more than one cell. The intra-line chunk cuts of a TABBED
# line are fenced by hyper_oracle::tests::tab_stops_agree_on_every_tier
# (cargo-test; a 135 KB line has no business in the fixture tree).
[[gate]]
name = "hyper-oracle"
scope = "render"
tier = "inner"
kind = "cmd"
relax = "renderer"
cmd = "GLYPH_TRACE=warn $GLYPH_RENDERER --hyper-oracle-check native/fixtures/cubecl-fork native/fixtures/g-cluster-repo native/fixtures/overflow-leads.txt native/fixtures/g-pick-repo native/fixtures/chunk-cut.txt native/fixtures/chunk-cut-paint.txt --cluster-mode leader && GLYPH_TRACE=warn GLYPH_HYPER_ORACLE_STRICT=1 $GLYPH_RENDERER --hyper-oracle-check engine/fixtures/*.pipe.bin native/fixtures/cubecl-fork native/fixtures/g-cluster-repo native/fixtures/overflow-leads.txt native/fixtures/g-pick-repo native/fixtures/chunk-cut.txt native/fixtures/chunk-cut-paint.txt && GLYPH_TRACE=warn GLYPH_HYPER_ORACLE_STRICT=1 $GLYPH_RENDERER --hyper-oracle-check native/fixtures/tab-stops native/fixtures/g-cluster-repo native/fixtures/g-pick-repo --tab-width 4 && GLYPH_TRACE=warn $GLYPH_RENDERER --hyper-oracle-check native/fixtures/tab-stops --tab-width 8 --cluster-mode leader"
pass_line = "hyper-oracle PASS"
needs = ["renderer", "fixtures"]
compare = "HyperLayout vs fold.rs's records compacted by layout::compact_records_into, bit-exact, through layout::diff_backends plus a per-record tally naming the byte, on FOUR tiers: records (its recording path, rederive.rs), host instances and placements (pass2_host.rs, a device-less load), and the DEVICE Pass 2 (pass2_device.rs, what every GPU load runs) run into host memory — the DerivedSlot on every lane it carries (the Instanced RenderSlot byte-for-byte too until that field's retirement, 2026-10-31) — plus its placements. Corpora: the 26 pipe fixtures (each item its own buffer, its own cluster mode; paged-rows, paged-cols and scroll-only carry the page_rows / page_cols / scroll_rows classes), the IMMUTABLE cubecl-fork corpus, g-cluster-repo, overflow-leads.txt, g-pick-repo and the IMMUTABLE chunk-cut.txt (lines cut inside into chunks: a sequence across each 64 KiB target, non-ASCII advances before each cut, a continuation wider than any ASCII segment past the first page) and the IMMUTABLE chunk-cut-paint.txt (a `return` across every intra-line cut, one pure-ASCII cut line; built for the paint tier retired 2026-10-11, kept as a cut input) in cluster mode, then those six again in leader mode. 2026-10-09 (with chunk-cut-paint.txt): 1,504,558 records / 1,497,095 instances / 1,497,095 device slots x2 / 47 placements in the strict cluster run (389 sequence heads, 36 ASCII-led); 1,349,336 records / 1,344,746 instances and device slots x2 / 14 placements in the leader run. STRICT (first run) refuses zero records, zero sequence heads, or zero ASCII-led heads; both runs refuse zero device slots. (A PAINT tier, C17, held the device Pass 2's syntax colouring to the whole-item colouriser from 2026-10-09 until the syntax heuristic was retired on 2026-10-11.) (A VISIBLE tier, M2/M3, held the Visible field's GPU layout kernel, and under byte spans its colouring, to the device Pass 2 from 2026-10-10 until the field was deleted on 2026-10-26; with it went the gate's only GPU use, so every tier now runs on the CPU.) TAB STOPS (2026-10-11): two more runs, every tier, at --tab-width 4 (strict, cluster: tab-stops, g-cluster-repo, g-pick-repo — 413,131 records / 411,950 instances and device slots x2, 658 tabs wider than a cell) and --tab-width 8 (leader: tab-stops — 5,311 records / 4,478 instances, 695 tabs wider than a cell); each refuses a corpus in which no tab spanned more than one cell"
blind_to = "Shared with the reference and so invisible here: the atlas trie (TrieTable::lookup, fu_to_world — the fixtures' own tries are world-unit and HyperLayout resolves font units) and fold::{rows_for_line, wrap_segment_of, wrap_row_of}, which HyperLayout borrows (reference-port fences those; phantom-row is the measured example). The device path past the emitter (the staging copy into VRAM, buffer chunking), the Derived field's vertex-stage Y/Z (the slot carries none), and the background Pass 1 prefetch (it runs the same Pass 1 driver as the inline Pass 1 used here). Paint: every tier runs flat paint, and the oracle has none; per-glyph colour through Pass 2 is cargo-test's (Paint::ByteSpans: hyper_byte_spans_painting, resolve_spans_and_inplace_update_slot_colors; Paint::PerRecord: windowed_emission_matches_unwindowed, hyper_and_batched_agree_on_samples), not here. Tab stops past one cell: NO oracle — the JS oracle and the fixtures know one-cell tabs only, so the reference there is fold.rs's own stop rule (fold::tests holds it to text::reference_layout, the independent lineage, and to the oracle-backed one-cell fold over the spaces a tab stands for); `fold::TabWidth::tab_cells` is shared by every engine and both witnesses but reference_layout, which computes the stop itself. A tabbed line long enough to be cut into chunks reaches this gate nowhere (cargo-test's grid has it)"

