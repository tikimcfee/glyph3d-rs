[[mutation]]
name = "scene-graph-cpu-mirror-compose-swapped"
gate = "cargo-test"
why = "the CPU subtree resolve (the mirror of a move: the rows pick, the HUD and the CPU cull read) composing local ∘ parent-world instead of parent-world ∘ local. The GPU draws the right frame and the CPU readers see another: a pick or a cull box off wherever a nested node moves. No golden view nests a group. CONSUMED BY: NodeTables::resolve_subtrees, run by GroupNodes::mirror_subtrees for every library move (ease, zone drag, file drag); reddens tables::tests::resolving_subtrees_on_the_cpu_matches_world_node_for_node"
file = "crates/glyph-scene-graph/src/tables.rs"
op = "replace"
find = "                    (Similarity::compose(&pw, &self.local[n]), pa * self.appearance[n].tint[3])"
with = "                    (Similarity::compose(&self.local[n], &pw), pa * self.appearance[n].tint[3])"
expect = "resolving_subtrees_on_the_cpu_matches_world_node_for_node"

