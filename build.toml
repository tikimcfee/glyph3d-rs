# build.toml — the declarative build/verify graph for glyph3d-native.
#
# Consumed by `glyph` (glyph/src/main.rs; `cargo glyph --help`). This file is
# the single account of WHICH artifacts exist, WHAT they are built from, and
# WHICH instruments run over them — the thing that used to live only as line
# order in tools/check-all.sh. Root AGENTS.md ("Verification") explains what
# each gate compares, what makes it red, and what it cannot see; the per-gate
# `blind_to` lines below are one-line reminders, not the full account.
#
# Classes:
#   committed — tracked in git; verified by rebuilding to a scratch path and
#               byte-comparing (or by the generator's own check mode). `build`
#               regenerates them in place; that is a deliberate, committable act.
#   golden    — committed, but the tool can NEVER build them: the expected bytes
#               are a golden master that cannot be derived from declared inputs
#               (re-baselining is a human decision). Verify only.
#   product   — untracked build output. Nothing to compare against; it only has
#               to be CURRENT (input-content stamp) before anything reads it.
#
# Counts are DECLARED here, never derived from the tree being checked (the
# old fixture gate `ls`-counted the tree it was checking; a deleted fixture
# then lowered both sides of the comparison and stayed green).

[settings]
# Ratchet, NOT an equality: tests are added constantly, so an exact pin would
# redden on the most common good action in the repo. A green run whose real
# count exceeds the floor prints a NOTE naming the value to raise it to.
test_floor = 249


# ── Products ─────────────────────────────────────────────────────────────

# The renderer's inputs are everything cargo compiles into the binary: its
# source and the workspace crates (every include_str!/include_bytes! resolves
# inside those two trees; the atlas is read at RUN time, not compiled in), the
# root manifest (workspace members, [profile.release]), the root lockfile
# (dependency versions) and cargo config. Until 2026-10-09 this named
# `native/Cargo.lock`, gone since the workspace move (2026-09-06), and omitted
# the root two, so a dependency bump left the stamp unchanged and `--frozen`
# called a stale binary current (measured: lockfile edited, "renderer
# current"). validate() now refuses a literal input that names no file.
[artifact.renderer]
class = "product"
outputs = ["target/release/glyph3d-native"]
# Built at WORKSPACE scope, as cargo-build and cargo-test then rebuild it:
# `cd native && cargo build` resolves features for this package alone, the
# workspace unifies them with glyph's (crypto-common/std, indexmap/default),
# and the two link different bytes. Until 2026-10-09 the stamp vouched for the
# package-scope binary and every gate after cargo-build ran the other one
# (measured: 62b55bfe vs 6dc7340c). Hence glyph/Cargo.toml as an input: its
# dependencies' features reach this binary.
inputs = ["native/src/**/*", "native/Cargo.toml", "crates/**/*", "glyph/Cargo.toml", "Cargo.toml", "Cargo.lock", ".cargo/config.toml"]
build = "cargo build --release"
note = "Pure-Rust native renderer."

# ── Committed artifacts ──────────────────────────────────────────────────

[artifact.engine-trie]
class = "committed"
outputs = ["assets/atlas/engine-trie.bin"]
inputs = ["assets/atlas/glyphs.bin", "assets/atlas/codepoints.bin", "tools/gen_real_trie.py"]
build = "python3 tools/gen_real_trie.py"
verify_cmd = "python3 tools/gen_real_trie.py --verify-only"
note = "Check mode rebuilds and byte-compares without writing; its own sweeps pin the semantics."

# The colour-emoji sheet: the vendored font's PNG bytes verbatim plus the
# tables that name them, keyed by the font's glyph id. Every bitmap the font
# has is a cell, sequence-only ones included (out/EMOJI.md). Rebuilt from the
# font alone, offline; the check mode rebuilds in memory, byte-compares, and
# asserts the structure the renderer relies on.
[artifact.emoji-sheet]
class = "committed"
outputs = ["assets/atlas/emoji-sheet.bin"]
inputs = ["tools/vendor/third-party/noto-emoji/NotoColorEmoji.ttf", "tools/gen_emoji_sheet.py", "tools/emoji_font.py"]
build = "pixi run gen-emoji-sheet"
verify_cmd = "pixi run python tools/gen_emoji_sheet.py --check"
note = "Generator-native check mode; fontTools lives in the pixi env. The font is pinned by fetch hash in vendor-manifest.py."

[artifact.cluster-classes]
class = "committed"
outputs = ["assets/atlas/cluster-classes.bin"]
inputs = ["tools/gen_cluster_table.py", "tools/vendor/third-party/unicode-ucd/*.txt"]
build = "python3 tools/gen_cluster_table.py"
verify_cmd = "python3 tools/gen_cluster_table.py --check"
note = "Grapheme-cluster class table, generated from the vendored UCD (never hand-written). Carried verbatim into both tries for the general UAX #29 phase; the landed sequence pass reads no classes by design — tests are its only readers today."

# Regeneration is by hand and ORDERED: cluster-classes (from the vendored UCD)
# and emoji-sheet (from the vendored font) first — the atlas reads BOTH — then
# engine-trie (reads codepoints.bin).
# `glyph build` verifies these; it does not run the chain.
[artifact.atlas]
class = "committed"
outputs = ["assets/atlas/curves.bin", "assets/atlas/glyphmap.bin", "assets/atlas/glyphs.bin", "assets/atlas/codepoints.bin"]
inputs = ["tools/export-atlas.mjs", "tools/vendor/ref/**/*", "tools/vendor/hb.cjs", "tools/vendor/hb.wasm", "assets/atlas/emoji-sheet.bin", "assets/atlas/cluster-classes.bin"]
build = "node tools/export-atlas.mjs"
verify_scratch = "node tools/export-atlas.mjs --out {scratch}"
note = "No generator-native check mode; the runner rebuilds to scratch and cmps. Self-aborts before writing if fonts/ranges drift. Slots 0..4430 are the web bake verbatim; the emoji slots after them come from emoji-sheet.bin."

[artifact.fixtures]
class = "committed"
outputs = ["engine/fixtures/*.pipe.bin", "engine/fixtures/*.bake.bin"]
inputs = ["engine/fixtures/gen.mjs", "engine/fixtures/gen-bake.mjs", "engine/fixtures/inputs/**/*", "engine/glyph_schema.mjs"]
build = "cd engine/fixtures && node gen.mjs && node gen-bake.mjs"
# Verified in a scratch COPY of engine/fixtures (+ ../glyph_schema.mjs, which
# gen.mjs imports) so the committed corpus is never deleted mid-check — the
# old gate deleted all 25 fixtures in place and restored them with git
# checkout. Counts are DECLARED, not ls-derived from the tree under test.
counts = { "pipe" = 26, "bake" = 8 }
note = "The Rust-side corpus pins (fixture.rs / bake.rs, 'update deliberately') stay; they and these declared counts are two independent witnesses, not duplicates."

[artifact.glyph-schema]
class = "committed"
outputs = ["engine/glyph_schema.mjs"]
inputs = ["tools/gen_schema.py", "schema/glyph-identity.json"]
build = "python3 tools/gen_schema.py"
verify_cmd = "python3 tools/gen_schema.py --check"
note = "The fixture format lanes gen.mjs writes, generated from the schema; --check also runs the schema's own invariant validation. Ungated from the Mojo retirement until 2026-10-09: the generator still emitted a .mojo half whose committed file was gone, so --check was red and no artifact declared it."

[artifact.emoji-corpus]
class = "committed"
outputs = ["native/fixtures/emoji-corpus-small.txt", "native/fixtures/emoji-corpus-large.txt"]
inputs = ["tools/gen_emoji_corpus.py", "assets/atlas/codepoints.bin"]
build = "python3 tools/gen_emoji_corpus.py"
verify_cmd = "python3 tools/gen_emoji_corpus.py --check"
note = "The cluster demo corpus, generated from codepoints.bin's v2 sequence section: the large file carries every table sequence exactly once (asserted at bake), the small one is the one-line-per-class quick check. A demo asset, not a golden input — emoji-cluster/repo-cluster pin the mechanism; this pins the corpus against the table moving. --check-render (manual) diffs the renderer's staged counts against the generator's simulator."

# ── Goldens ──────────────────────────────────────────────────────────────
# Verified, NEVER built. These byte-equal screenshots are the only PIXEL
# gate, and the expected bytes cannot be derived from anything —
# re-rendering after a deliberate renderer change and committing the new
# PNGs is a human re-baseline act, done by hand, with a note in the commit.
# The tool refuses to regenerate them: no build command exists for this
# artifact, by design.
#
# ONE SET PER RASTERIZER. `{gpu}` is the key the renderer prints from
# `--gpu-key` (`<backend>-<vendor>`, e.g. metal-apple, vulkan-nvidia): the
# first Linux run (2026-09-07) showed NVIDIA's Vulkan rasterizer flips
# isolated edge pixels against Metal renders while every numeric gate stays
# bit-exact, so a golden set is a property of the hardware, not of the tree,
# and matching them across vendors is not a goal. Each set carries an
# ADAPTER.txt (`--gpu-profile`) naming the device and driver that made it;
# the gate prints a NOTE when the live adapter disagrees with the record. A
# host with no set for its key is red with the adoption commands printed —
# adopting is still by hand. `glyph drift` compares this host's renders
# against every OTHER set, so a cross-vendor difference that stops looking
# like edge noise is visible without being a gate.

[artifact.pixel-baselines]
class = "golden"
outputs = [
  "out/tooling-ab/baseline/{gpu}/demo.png",
  "out/tooling-ab/baseline/{gpu}/text.png",
  "out/tooling-ab/baseline/{gpu}/repo-zoom.png",
  "out/tooling-ab/baseline/{gpu}/repo-wide.png",
  "out/tooling-ab/baseline/{gpu}/repo-down.png",
  "out/tooling-ab/baseline/{gpu}/repo-back-oblique.png",
  "out/tooling-ab/baseline/{gpu}/emoji.png",
  "out/tooling-ab/baseline/{gpu}/emoji-cluster.png",
  "out/tooling-ab/baseline/{gpu}/repo-cluster.png",
]
inputs = ["target/release/glyph3d-native", "native/fixtures/baseline-view.txt", "native/fixtures/emoji-view.txt", "native/fixtures/emoji-cluster-view.txt", "native/fixtures/g-pick-repo/**/*", "native/fixtures/g-cluster-repo/**/*", "assets/atlas/emoji-sheet.bin"]
note = "Blind to everything outside these frames, and cannot distinguish a regression from an intentional change. One set per rasterizer ({gpu}); a set only ever proves the renderer on the hardware that made it. empty.rs in g-pick-repo is zero bytes ON PURPOSE (the only input reaching the page-extent origin seed)."

# Per-view render commands (run from native/, screenshot into {scratch}).
[[golden_view]]
name = "demo"
cmd = "--demo --frames 2"
[[golden_view]]
name = "text"
cmd = "--render-file fixtures/baseline-view.txt --frames 2"
# The three repo views deliberately do NOT pin --repo-engine: they render on
# whatever the DEFAULT strategy is, because the default is what ships and the
# pixels are the only check that sees it end to end. The strategies are
# bit-exact, so these frames staying byte-equal across a default change is the
# proof that the change was safe — which is exactly what happened when `direct`
# became the default.
[[golden_view]]
name = "repo-wide"
cmd = "--load-repo fixtures/g-pick-repo --frames 2 --color-mode syntax"
[[golden_view]]
name = "repo-down"
cmd = "--load-repo fixtures/g-pick-repo --frames 2 --wrap-mode down --color-mode syntax"
[[golden_view]]
name = "repo-zoom"
cmd = "--load-repo fixtures/g-pick-repo --frames 2 --focus-file alpha.rs --zoom 3 --color-mode syntax"
# The z-order frame. Front-on views cannot see whether a wrapped column that
# recedes in `back` mode is occluded by the page beside it — that needs a
# camera pitched down over wide.txt so its column converges up into long.md.
# Added 2026-09-07 when exactly that was found wrong (the glyph pass tested
# depth without writing it, so draw order decided visibility). The
# `depth-write-off` mutation is what proves this frame sees the class.
[[golden_view]]
name = "repo-back-oblique"
cmd = "--load-repo fixtures/g-pick-repo --frames 2 --cam-pose 30 -120 60 0 -12 --color-mode syntax"
# The colour-emoji frame (2026-09-10): every class of bitmap slot the trie has
# — web-era re-pointed, appended, no-cell, emoji-in-the-font-but-text-here —
# through the CPU staging path and the shader's mode-1 branch. The only frame
# that samples the emoji sheet, so the only one that can see it; expect more
# cross-vendor drift here than on text (filtered sampling is not analytic
# coverage). `emoji-uv-flip` proves it reddens. It pins `--cluster-mode
# leader` by hand: since the 2026-09-22 default flip, the unpinned views all
# render cluster mode.
[[golden_view]]
name = "emoji"
cmd = "--render-file fixtures/emoji-view.txt --frames 2 --zoom 1.25 --cluster-mode leader"
# The sequence pass, on the CPU staging path: cluster-mode rendering of every
# sequence class the trie resolves (families, flags, skin tones, keycaps, tag
# flags) plus the fallbacks (pieces for unlisted chains, zero-width ZWJ). Its
# leader twin is emoji.png, which KEEPS pinning leader mode — the fixture is
# immutable and the mode flag in its cmd is what makes the split explicit at
# the flip, whenever that comes.
[[golden_view]]
name = "emoji-cluster"
cmd = "--render-file fixtures/emoji-cluster-view.txt --frames 2 --zoom 1.25 --cluster-mode cluster"
# The repo-load twin: a tiny repo whose files carry the same classes through
# --load-repo (HyperLayout resolves them end to end).
[[golden_view]]
name = "repo-cluster"
cmd = "--load-repo fixtures/g-cluster-repo --frames 2 --cluster-mode cluster --color-mode syntax"

# ── Gates ────────────────────────────────────────────────────────────────
# `scope` answers "I changed X, what should I run" — the question the CLI is
# organised around, rather than the twelve-item list this used to be:
#   rust    you touched native/, crates/ or glyph/
#   render  you touched layout, shaders, or anything that moves a pixel
#   corpus  you touched fixtures, generators, or vendored inputs
# `glyph test` with no scope runs all of them, in the order below.
# The battery `glyph check` runs, in order. `needs` lists artifacts that must
# be current/verified first; the runner enforces the order below, which
# satisfies them. Names, not numbers — positions in this list have been
# renumbered twice already and a name survives renumbering.

# First, because every gate below reads the map this checks. It is the only
# gate whose subject is build.toml itself: a manifest that lies makes each
# green beneath it a claim about something other than what it names.
[[gate]]
name = "manifest"
scope = "corpus"
kind = "cmd"
cmd = "target/release/glyph validate"
needs = []
compare = "build.toml against itself: every `needs` resolves and orders, every gate and mutation names a real target, every golden output is keyed by {gpu}, and every PRODUCT input, glob or literal, matches at least one file"
blind_to = "whether the declared inputs are the RIGHT ones — it proves a pattern matches something, never that it matches everything that matters"

[[gate]]
name = "committed-artifacts"
scope = "corpus"
kind = "verify-committed"   # glyph-schema, emoji-sheet, cluster-classes, emoji-corpus, engine-trie, atlas, fixtures
needs = []
compare = "each committed artifact rebuilt (scratch or generator check mode) vs its committed bytes"
blind_to = "whether the INPUTS are right — reproducibility, not truth"

[[gate]]
name = "vendor-hashes"
scope = "corpus"
kind = "cmd"
cmd = "python3 tools/vendor-manifest.py --check"
needs = []
compare = "every file in tools/vendor/SHA256SUMS vs its hash; hb.* also re-derived from their ref sources; third-party files also vs their recorded fetch hash"
blind_to = "upstream drift (by design) and a wrong-but-self-consistent vendored revision — the fixture corpus gate is the cover for the second"

[[gate]]
name = "cargo-build"
scope = "rust"
kind = "cargo"
cmd = "build"
needs = []
compare = "rustc warning count vs zero"

[[gate]]
name = "cargo-clippy"
scope = "rust"
kind = "cargo"
cmd = "clippy"
needs = []
compare = "clippy warning count vs zero"
blind_to = "anything silenced with #[allow(...)]"

[[gate]]
name = "cargo-doc"
scope = "rust"
kind = "cargo"
cmd = "doc"
needs = []
compare = "rustdoc warning count vs zero — intra-doc links resolve, HTML in prose is closed"
blind_to = "whether the prose is TRUE; it checks that every symbol a doc comment names still exists, not that the sentence around it is current"

[[gate]]
name = "cargo-test"
scope = "rust"
kind = "cargo-test"
needs = []
compare = "summed tests-actually-ran vs settings.test_floor ratchet; whole-binary dropout check"
blind_to = "nothing, structurally — that is what the floor is for. Holds the two corpus-size pins."

[[gate]]
name = "pick-oracle"
scope = "render"
kind = "cmd"
cmd = "bash tools/check-pick-oracle.sh"
pass_line = "ALL PASS"
needs = ["renderer"]
compare = "scripted picks and pixel-ray round trips vs an independent Python fold oracle"
blind_to = "pick paths outside the scripted set"

# ── The layout against the oracle, and the engines against each other ────
# Re-gated 2026-10-09. 5e94de8 (2026-09-30) removed these with the engine
# they partly served; the instruments kept shipping and kept passing, run by
# nothing. Each refuses to pass having compared nothing.

# The Rust layout forms against the JS oracle's recorded answers. The volumes
# the five halves clear today are quoted in `compare` — a count that quietly
# drops is how this would go vacuous without going red.
[[gate]]
name = "reference-port"
scope = "corpus"
kind = "cmd"
cmd = "bash tools/check-fixture-parity.sh"
pass_line = "ALL PASS"
needs = ["renderer", "fixtures"]
compare = "five Rust forms vs the JS oracle's recorded answers over engine/fixtures (26 pipe + 8 bake, counts declared in the script): trie rebuilt from bytes (23,552 entries); serial fold, every lane of every byte (155,222 leaders, 1,874,328 lanes bit-exact); scan form across 8 tunings (208 cases, 1,188,024 leader-lanes bit-exact, 53,752 within 1e-4); bake + seed protocol (27,315 leaders, 167 checkpoints, 530 queries); text.rs's independent fold over its domain (4 fixtures, 5,332 records)"
blind_to = "HyperLayout and CubeCL entirely — these are fold.rs/scan.rs/bake.rs/text.rs, not the engines that ship (hyper-oracle holds HyperLayout to fold.rs); the atlas trie (fixtures carry their own synthetic tries); any fixture outside text.rs's domain, silently (22 of 26 today); the parse, except through the lanes computed from it (its second loader, Mojo, is retired)"

# HyperLayout — the production engine — against the oracle-backed fold.
# Red from 2026-10-09 (C10, C13, C14 in out/MAINTENANCE-NOTES-2026-10-08.md)
# until the C10/C13 fix the same day. The three fixtures that set
# scroll_rows / page_cols were split out to a red `hyper-oracle-paged` gate
# while C14 (both Pass 2 paths paginated them unlike the fold) was open; C14
# is fixed (dd6fe01) and they are back here, with the paged gate deleted.
# g-pick-repo (every repo golden's corpus: wide.txt is cut inside its long
# line) and chunk-cut.txt (built for the intra-line cut classes, C15) joined
# both runs with the C15 fix (c35770e).
# The second invocation is the leader-mode run (C13's volume class): the same
# corpora with every item in leader mode, so a mode that leaks is red on
# 319,628 records rather than the 12 of cluster-zwj's leader item.
[[gate]]
name = "hyper-oracle"
scope = "render"
kind = "cmd"
cmd = "GLYPH_TRACE=warn target/release/glyph3d-native --hyper-oracle-check native/fixtures/cubecl-fork native/fixtures/g-cluster-repo native/fixtures/overflow-leads.txt native/fixtures/g-pick-repo native/fixtures/chunk-cut.txt --cluster-mode leader && GLYPH_TRACE=warn GLYPH_HYPER_ORACLE_STRICT=1 target/release/glyph3d-native --hyper-oracle-check engine/fixtures/*.pipe.bin native/fixtures/cubecl-fork native/fixtures/g-cluster-repo native/fixtures/overflow-leads.txt native/fixtures/g-pick-repo native/fixtures/chunk-cut.txt"
pass_line = "hyper-oracle PASS"
needs = ["renderer", "fixtures"]
compare = "HyperLayout vs fold.rs's records compacted by layout::compact_records_into, bit-exact, through layout::diff_backends plus a per-record tally naming the byte, on FOUR tiers: records (its recording path, rederive.rs), host instances and placements (pass2_host.rs, a device-less load), and the DEVICE Pass 2 (pass2_device.rs, what every GPU load runs) run into host memory in both slot formats — RenderSlot byte-for-byte, DerivedSlot on every lane it carries — plus its placements. Corpora: the 26 pipe fixtures (each item its own buffer, its own cluster mode; paged-rows, paged-cols and scroll-only carry the page_rows / page_cols / scroll_rows classes), the IMMUTABLE cubecl-fork corpus, g-cluster-repo, overflow-leads.txt, g-pick-repo and the IMMUTABLE chunk-cut.txt (lines cut inside into chunks: a sequence across each 64 KiB target, non-ASCII advances before each cut, a continuation wider than any ASCII segment past the first page) in cluster mode, then those five again in leader mode. 2026-10-09: 1,143,155 records / 1,135,697 instances / 1,135,697 device slots x2 / 46 placements in the first run (389 sequence heads, 36 ASCII-led); 987,933 records / 983,348 instances and device slots x2 / 13 placements in the leader run. STRICT (first run) refuses zero records, zero sequence heads, or zero ASCII-led heads; both runs refuse zero device slots"
blind_to = "Shared with the reference and so invisible here: the atlas trie (TrieTable::lookup, fu_to_world — the fixtures' own tries are world-unit and HyperLayout resolves font units) and fold::{rows_for_line, wrap_segment_of, wrap_row_of}, which HyperLayout borrows (reference-port fences those; phantom-row is the measured example). The device path past the emitter (the staging copy into VRAM, buffer chunking), the Derived field's vertex-stage Y/Z (the slot carries none), and the background Pass 1 prefetch (repo-verify holds it to the inline Pass 1 used here; since C15 both share one Pass 1 driver). Paint: every item is flat on both sides, so the device path's per-chunk syntax colouring (which restarts at an intra-line cut, unlike the whole-item colorizer) is not under test"

# HyperLayout against itself. EVERY --repo-engine but cubecl constructs the
# same HyperLayout (layout.rs's backend table), so this is not an independent
# witness of anything: under --repo-scan-only (no GPU) the only difference
# between the two sides is `hyper`'s background prefetch of Pass 1. It
# catches nondeterminism in the parallel passes and prefetch/inline drift;
# truth is hyper-oracle's job. --repo-scan-only is LOAD-BEARING: without it
# this opens the windowed renderer and never returns.
[[gate]]
name = "repo-verify"
scope = "render"
kind = "repo-verify"
cmd = "--load-repo fixtures/g-pick-repo --wrap-mode {mode} --repo-engine hyper --repo-verify --repo-scan-only"
modes = ["down", "back"]
needs = ["renderer"]
compare = "`hyper` (prefetched Pass 1, recording) vs a fresh non-prefetched HyperLayout recording: placements, instances and 32 B records bit-exact over g-pick-repo (5 items, 407,133 instances, 407,451 records), both wrap modes; refuses zero items or instances"
blind_to = "any fault in HyperLayout itself — both sides are HyperLayout (hyper-oracle is the oracle check). `batch`/`naive` are not gated: they run the reference's own code path verbatim. No mutation reddens this on this corpus: since C15 the prefetch and inline Pass 1 are one driver (pass1_over_chunks) differing only in how the chunk list is built (before it, only in a segment-advance table g-pick-repo never read: doubling it stayed green, measured 2026-10-09), so it is UNCOVERED in prove, honestly"

# `direct`: the non-recording call against the recording one. Same engine,
# same host path under --repo-scan-only, so records are not compared (direct
# produces none — the PASS line says `0 records`).
[[gate]]
name = "repo-verify-direct"
scope = "render"
kind = "repo-verify"
cmd = "--load-repo fixtures/g-pick-repo --wrap-mode {mode} --repo-engine direct --repo-verify --repo-scan-only"
modes = ["down", "back"]
needs = ["renderer"]
compare = "`direct` (layout_items, no records) vs a HyperLayout recording: placements and instances bit-exact over g-pick-repo, both wrap modes; refuses zero items or instances"
blind_to = "the wire-record tier (direct makes none) and every fault both calls share — without a GPU both run the same host Pass 2, so this is a determinism check, not a strategy comparison; the device path is not reached. UNCOVERED in prove: no mutation separates the two sides"

# The CubeCL chain. Both were RED when re-gated (C10): chain on cluster-flags
# since 26595fb (2026-10-06, bisected; the instrument, fixed in c5ef78a), fork
# since HyperLayout became its reference (2026-09-30; HyperLayout's keycaps,
# fixed 2026-10-09). Both green since. Their 2026-09-30 mutations were
# checked for landing by hand while red.
[[gate]]
name = "cubecl-chain"
scope = "rust"
kind = "cmd"
cmd = "bash tools/check-cubecl.sh chain"
pass_line = "ALL PASS"
needs = ["renderer"]
compare = "the device chain vs the CPU scan reference (scan.rs) over five fixtures (wrapback-long-line, paged-rows, paged-cols, multi-item, cluster-flags): counts/rows exact, fold>0 X bit-exact, line_adv + positions at the eps tier, the emitted records tier-diffed"
blind_to = "Green since c5ef78a (red 2026-10-06..09: 26595fb left this driver uploading CPU flags without the device-only cluster-head bit; production was unaffected). Corpora outside the five fixtures; HyperLayout (this is chain-vs-CPU-scan); the device decode and cluster stages (this driver uploads CPU-computed statics)"

[[gate]]
name = "cubecl-fork"
scope = "rust"
kind = "cmd"
cmd = "bash tools/check-cubecl.sh fork"
pass_line = "ALL PASS"
needs = ["renderer"]
compare = "the full from-bytes chain vs HyperLayout over the IMMUTABLE native/fixtures/cubecl-fork corpus in STRICT mode: the 32 B slot stream field-equal, placements bit-equal, tint pairs equal, the census's m>=3 / seg>=3 buckets and cluster candidates proven exercised"
blind_to = "Green since the HyperLayout keycap fix (2026-10-09; before it 314,405 of 314,686 slots / 708,529 lane words differed, and hyper-oracle showed HyperLayout, not the chain, was wrong). The reference is HyperLayout, so this is agreement with the oracle only through hyper-oracle. The script's second (chunked) pass sets GLYPH_RECORD_CHUNK, which nothing has read since d46a6c3: it repeats the first. NO MUTATION: all nine 2026-09-30 targets that still exist textually (tail.rs scatter/extent/tint, position.rs paginate/z-step/segment-reset) and two adapted to the fused apply_and_emit kernel left the counts unchanged (708,529 / 0 / 0, measured by hand 2026-10-09) — they land in kernels this path does not run, or in lanes the comparison does not separate. Corpora outside the fixture"

[[gate]]
name = "pixel-ab"
scope = "render"
kind = "golden-verify"
needs = ["renderer", "pixel-baselines"]
compare = "every declared golden_view re-rendered vs out/tooling-ab/baseline/<this host's --gpu-key>, byte-equal"
blind_to = "everything outside the declared frames; regression vs intentional change (re-baselining is a human act); any rasterizer other than this host's — a set proves nothing about another vendor"

# ── Declared mutations ───────────────────────────────────────────────────
# `glyph mutate` applies each of these, requires the named gate to go red
# with the named text, and restores byte-exact. A gate with no mutation is
# reported as uncovered — an unproven claim, not a passing one.
#
# ops: append (bytes onto the file) - replace (find -> with, first match) -
#      remove (move the file aside). The original bytes are snapshotted and
#      written back regardless of op, so restore is uniform and checkable.

[[mutation]]
name = "dead-input-glob"
gate = "manifest"
why = "a product input pattern matching NO file makes the currency stamp hash nothing of what it names, so `build` skips the build and `test --frozen` asserts currency over a stale binary. `native/src/**` was exactly this from 598205b until 2026-09-16 — glob's `**` matches directories, input_digest filters to files. CONSUMED BY: the product-input scan in validate(), and nothing else"
file = "build.toml"
op = "replace"
find = '"native/src/**/*"'
with = '"native/src/**"'
expect = "matches no file"

[[mutation]]
name = "dead-input-literal"
gate = "manifest"
why = "the literal-path twin of dead-input-glob: an input naming a file that does not exist hashes nothing for it, so changes to what it was meant to cover never stale the product. `native/Cargo.lock` was exactly this from the workspace move (2026-09-06) until 2026-10-09, invisible because the dead-glob check only scanned patterns containing `*`. CONSUMED BY: the product-input scan in validate(), and nothing else"
file = "build.toml"
op = "replace"
find = '"Cargo.toml", "Cargo.lock", ".cargo/config.toml"'
with = '"Cargo.toml", "native/Cargo.lock", ".cargo/config.toml"'
expect = "matches no file"

[[mutation]]
name = "empty-test-selection-passes"
gate = "cargo-test"
why = "`glyph test <scope>` over a scope with no gates printed ALL GATES GREEN and exited 0: `glyph test engine` did exactly that from the Mojo retirement until 2026-10-09. A run that checks nothing must not read as a pass. CONSUMED BY: test_verdict in glyph/src/main.rs, via its unit test"
file = "glyph/src/main.rs"
op = "replace"
find = "    if selected == 0 {\n        return (false,"
with = "    if selected == usize::MAX {\n        return (false,"
expect = "empty_gate_selection_is_refused"
# cargo-test relinks target/release/glyph from the mutated source, and every
# later gate in the run is spawned from that path (self_exe): restore it.
rebuild = "cargo build --release -p glyph"

[[mutation]]
name = "prove-restale-blind"
gate = "cargo-test"
why = "A cargo-test mutation without `rebuild` left the MUTATED renderer in target/release behind a stamp that still read current (cargo test --release links the bin; found 2026-10-09 with tail-pads-zero: 62b55bfe -> 928dc5b4, 'renderer current'), so every later gate and every hand timing tested the mutant. prove now drops the stamp of each product the restored file feeds and rebuilds it; matching no product restores the blind spot. CONSUMED BY: products_reading in glyph/src/main.rs, via its unit test"
file = "glyph/src/main.rs"
op = "replace"
find = ".filter(|(_, a)| a.inputs.iter().any(|pat| expand(pat).contains(&f)))"
with = ".filter(|(_, a)| a.inputs.is_empty() && expand(\"\").contains(&f))"
expect = "mutated_inputs_name_the_products_they_feed"
rebuild = "cargo build --release -p glyph"

