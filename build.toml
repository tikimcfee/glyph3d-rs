# build.toml — the declarative build/verify graph for glyph3d-native.
#
# Consumed by `glyph` (glyph/src/main.rs; `cargo glyph --help`). This file is
# the single account of WHICH artifacts exist, WHAT they are built from, and
# WHICH instruments run over them — the thing that used to live only as line
# order in tools/check-all.sh. Root AGENTS.md ("Verification") explains what
# each gate compares, what makes it red, and what it cannot see; the per-gate
# `blind_to` lines below are one-line reminders, not the full account.
#
# Classes:
#   committed — tracked in git; verified by rebuilding to a scratch path and
#               byte-comparing (or by the generator's own check mode). `build`
#               regenerates them in place; that is a deliberate, committable act.
#   golden    — committed, but the tool can NEVER build them: the expected bytes
#               are a golden master that cannot be derived from declared inputs
#               (re-baselining is a human decision). Verify only.
#   product   — untracked build output. Nothing to compare against; it only has
#               to be CURRENT (input-content stamp) before anything reads it.
#
# Counts are DECLARED here, never derived from the tree being checked (the
# old fixture gate `ls`-counted the tree it was checking; a deleted fixture
# then lowered both sides of the comparison and stayed green).

[settings]
# Ratchet, NOT an equality: tests are added constantly, so an exact pin would
# redden on the most common good action in the repo. A green run whose real
# count exceeds the floor prints a NOTE naming the value to raise it to.
test_floor = 220


# ── Products ─────────────────────────────────────────────────────────────

# `{dylib}` is the host's shared-library extension (dylib on macOS, so on
# Linux), substituted by the runner at load. pixi.toml's build-engine task is
# per-platform for the same reason.
[artifact.renderer]
class = "product"
outputs = ["target/release/glyph3d-native"]
inputs = ["native/src/**/*", "native/Cargo.toml", "native/Cargo.lock", "crates/**/*"]
build = "cd native && cargo build --release"
note = "Pure-Rust native renderer."

# ── Committed artifacts ──────────────────────────────────────────────────

[artifact.engine-trie]
class = "committed"
outputs = ["assets/atlas/engine-trie.bin"]
inputs = ["assets/atlas/glyphs.bin", "assets/atlas/codepoints.bin", "tools/gen_real_trie.py"]
build = "python3 tools/gen_real_trie.py"
verify_cmd = "python3 tools/gen_real_trie.py --verify-only"
note = "Check mode rebuilds and byte-compares without writing; its own sweeps pin the semantics."

# The colour-emoji sheet: the vendored font's PNG bytes verbatim plus the
# tables that name them, keyed by the font's glyph id. Every bitmap the font
# has is a cell, sequence-only ones included (out/EMOJI.md). Rebuilt from the
# font alone, offline; the check mode rebuilds in memory, byte-compares, and
# asserts the structure the renderer relies on.
[artifact.emoji-sheet]
class = "committed"
outputs = ["assets/atlas/emoji-sheet.bin"]
inputs = ["tools/vendor/third-party/noto-emoji/NotoColorEmoji.ttf", "tools/gen_emoji_sheet.py", "tools/emoji_font.py"]
build = "pixi run gen-emoji-sheet"
verify_cmd = "pixi run python tools/gen_emoji_sheet.py --check"
note = "Generator-native check mode; fontTools lives in the pixi env. The font is pinned by fetch hash in vendor-manifest.py."

[artifact.cluster-classes]
class = "committed"
outputs = ["assets/atlas/cluster-classes.bin"]
inputs = ["tools/gen_cluster_table.py", "tools/vendor/third-party/unicode-ucd/*.txt"]
build = "python3 tools/gen_cluster_table.py"
verify_cmd = "python3 tools/gen_cluster_table.py --check"
note = "Grapheme-cluster class table, generated from the vendored UCD (never hand-written). Carried verbatim into both tries for the general UAX #29 phase; the landed sequence pass reads no classes by design — tests are its only readers today."

# Regeneration is by hand and ORDERED: cluster-classes (from the vendored UCD)
# and emoji-sheet (from the vendored font) first — the atlas reads BOTH — then
# engine-trie (reads codepoints.bin).
# `glyph build` verifies these; it does not run the chain.
[artifact.atlas]
class = "committed"
outputs = ["assets/atlas/curves.bin", "assets/atlas/glyphmap.bin", "assets/atlas/glyphs.bin", "assets/atlas/codepoints.bin"]
inputs = ["tools/export-atlas.mjs", "tools/vendor/ref/**/*", "tools/vendor/hb.cjs", "tools/vendor/hb.wasm", "assets/atlas/emoji-sheet.bin", "assets/atlas/cluster-classes.bin"]
build = "node tools/export-atlas.mjs"
verify_scratch = "node tools/export-atlas.mjs --out {scratch}"
note = "No generator-native check mode; the runner rebuilds to scratch and cmps. Self-aborts before writing if fonts/ranges drift. Slots 0..4430 are the web bake verbatim; the emoji slots after them come from emoji-sheet.bin."

[artifact.fixtures]
class = "committed"
outputs = ["engine/fixtures/*.pipe.bin", "engine/fixtures/*.bake.bin"]
inputs = ["engine/fixtures/gen.mjs", "engine/fixtures/gen-bake.mjs", "engine/fixtures/inputs/**/*", "engine/glyph_schema.mjs"]
build = "cd engine/fixtures && node gen.mjs && node gen-bake.mjs"
# Verified in a scratch COPY of engine/fixtures (+ ../glyph_schema.mjs, which
# gen.mjs imports) so the committed corpus is never deleted mid-check — the
# old gate deleted all 25 fixtures in place and restored them with git
# checkout. Counts are DECLARED, not ls-derived from the tree under test.
counts = { "pipe" = 26, "bake" = 8 }
note = "The Rust-side corpus pins (fixture.rs / bake.rs, 'update deliberately') stay; they and these declared counts are two independent witnesses, not duplicates."

[artifact.emoji-corpus]
class = "committed"
outputs = ["native/fixtures/emoji-corpus-small.txt", "native/fixtures/emoji-corpus-large.txt"]
inputs = ["tools/gen_emoji_corpus.py", "assets/atlas/codepoints.bin"]
build = "python3 tools/gen_emoji_corpus.py"
verify_cmd = "python3 tools/gen_emoji_corpus.py --check"
note = "The cluster demo corpus, generated from codepoints.bin's v2 sequence section: the large file carries every table sequence exactly once (asserted at bake), the small one is the one-line-per-class quick check. A demo asset, not a golden input — emoji-cluster/repo-cluster pin the mechanism; this pins the corpus against the table moving. --check-render (manual) diffs the renderer's staged counts against the generator's simulator."

# ── Goldens ──────────────────────────────────────────────────────────────
# Verified, NEVER built. These byte-equal screenshots are the only PIXEL
# gate, and the expected bytes cannot be derived from anything —
# re-rendering after a deliberate renderer change and committing the new
# PNGs is a human re-baseline act, done by hand, with a note in the commit.
# The tool refuses to regenerate them: no build command exists for this
# artifact, by design.
#
# ONE SET PER RASTERIZER. `{gpu}` is the key the renderer prints from
# `--gpu-key` (`<backend>-<vendor>`, e.g. metal-apple, vulkan-nvidia): the
# first Linux run (2026-09-07) showed NVIDIA's Vulkan rasterizer flips
# isolated edge pixels against Metal renders while every numeric gate stays
# bit-exact, so a golden set is a property of the hardware, not of the tree,
# and matching them across vendors is not a goal. Each set carries an
# ADAPTER.txt (`--gpu-profile`) naming the device and driver that made it;
# the gate prints a NOTE when the live adapter disagrees with the record. A
# host with no set for its key is red with the adoption commands printed —
# adopting is still by hand. `glyph drift` compares this host's renders
# against every OTHER set, so a cross-vendor difference that stops looking
# like edge noise is visible without being a gate.

[artifact.pixel-baselines]
class = "golden"
outputs = [
  "out/tooling-ab/baseline/{gpu}/demo.png",
  "out/tooling-ab/baseline/{gpu}/text.png",
  "out/tooling-ab/baseline/{gpu}/repo-zoom.png",
  "out/tooling-ab/baseline/{gpu}/repo-wide.png",
  "out/tooling-ab/baseline/{gpu}/repo-down.png",
  "out/tooling-ab/baseline/{gpu}/repo-back-oblique.png",
  "out/tooling-ab/baseline/{gpu}/emoji.png",
  "out/tooling-ab/baseline/{gpu}/emoji-cluster.png",
  "out/tooling-ab/baseline/{gpu}/repo-cluster.png",
]
inputs = ["target/release/glyph3d-native", "native/fixtures/baseline-view.txt", "native/fixtures/emoji-view.txt", "native/fixtures/emoji-cluster-view.txt", "native/fixtures/g-pick-repo/**/*", "native/fixtures/g-cluster-repo/**/*", "assets/atlas/emoji-sheet.bin"]
note = "Blind to everything outside these frames, and cannot distinguish a regression from an intentional change. One set per rasterizer ({gpu}); a set only ever proves the renderer on the hardware that made it. empty.rs in g-pick-repo is zero bytes ON PURPOSE (the only input reaching the page-extent origin seed)."

# Per-view render commands (run from native/, screenshot into {scratch}).
[[golden_view]]
name = "demo"
cmd = "--demo --frames 2"
[[golden_view]]
name = "text"
cmd = "--render-file fixtures/baseline-view.txt --frames 2"
# The three repo views deliberately do NOT pin --repo-engine: they render on
# whatever the DEFAULT strategy is, because the default is what ships and the
# pixels are the only check that sees it end to end. The strategies are
# bit-exact, so these frames staying byte-equal across a default change is the
# proof that the change was safe — which is exactly what happened when `direct`
# became the default.
[[golden_view]]
name = "repo-wide"
cmd = "--load-repo fixtures/g-pick-repo --frames 2 --color-mode syntax"
[[golden_view]]
name = "repo-down"
cmd = "--load-repo fixtures/g-pick-repo --frames 2 --wrap-mode down --color-mode syntax"
[[golden_view]]
name = "repo-zoom"
cmd = "--load-repo fixtures/g-pick-repo --frames 2 --focus-file alpha.rs --zoom 3 --color-mode syntax"
# The z-order frame. Front-on views cannot see whether a wrapped column that
# recedes in `back` mode is occluded by the page beside it — that needs a
# camera pitched down over wide.txt so its column converges up into long.md.
# Added 2026-09-07 when exactly that was found wrong (the glyph pass tested
# depth without writing it, so draw order decided visibility). The
# `depth-write-off` mutation is what proves this frame sees the class.
[[golden_view]]
name = "repo-back-oblique"
cmd = "--load-repo fixtures/g-pick-repo --frames 2 --cam-pose 30 -120 60 0 -12 --color-mode syntax"
# The colour-emoji frame (2026-09-10): every class of bitmap slot the trie has
# — web-era re-pointed, appended, no-cell, emoji-in-the-font-but-text-here —
# through the CPU staging path and the shader's mode-1 branch. The only frame
# that samples the emoji sheet, so the only one that can see it; expect more
# cross-vendor drift here than on text (filtered sampling is not analytic
# coverage). `emoji-uv-flip` proves it reddens. It pins `--cluster-mode
# leader` by hand: since the 2026-09-22 default flip, the unpinned views all
# render cluster mode.
[[golden_view]]
name = "emoji"
cmd = "--render-file fixtures/emoji-view.txt --frames 2 --zoom 1.25 --cluster-mode leader"
# The sequence pass, on the CPU staging path: cluster-mode rendering of every
# sequence class the trie resolves (families, flags, skin tones, keycaps, tag
# flags) plus the fallbacks (pieces for unlisted chains, zero-width ZWJ). Its
# leader twin is emoji.png, which KEEPS pinning leader mode — the fixture is
# immutable and the mode flag in its cmd is what makes the split explicit at
# the flip, whenever that comes.
[[golden_view]]
name = "emoji-cluster"
cmd = "--render-file fixtures/emoji-cluster-view.txt --frames 2 --zoom 1.25 --cluster-mode cluster"
# The engine path twin: a tiny repo whose files carry the same classes through
# --load-repo (the FFI + engine resolve them end to end).
[[golden_view]]
name = "repo-cluster"
cmd = "--load-repo fixtures/g-cluster-repo --frames 2 --cluster-mode cluster --color-mode syntax"

# ── Gates ────────────────────────────────────────────────────────────────
# `scope` answers "I changed X, what should I run" — the question the CLI is
# organised around, rather than the twelve-item list this used to be:
#   engine  you touched engine/*.mojo or the FFI
#   rust    you touched native/src
#   render  you touched layout, shaders, or anything that moves a pixel
#   corpus  you touched fixtures, generators, or vendored inputs
# `glyph test` with no scope runs all of them, in the order below.
# The battery `glyph check` runs, in order. `needs` lists artifacts that must
# be current/verified first; the runner enforces the order below, which
# satisfies them. Names, not numbers — positions in this list have been
# renumbered twice already and a name survives renumbering.

# First, because every gate below reads the map this checks. It is the only
# gate whose subject is build.toml itself: a manifest that lies makes each
# green beneath it a claim about something other than what it names.
[[gate]]
name = "manifest"
scope = "corpus"
kind = "cmd"
cmd = "target/release/glyph validate"
needs = []
compare = "build.toml against itself: every `needs` resolves and orders, every gate and mutation names a real target, every golden output is keyed by {gpu}, and every glob in a PRODUCT's inputs matches at least one file"
blind_to = "whether the declared inputs are the RIGHT ones — it proves a pattern matches something, never that it matches everything that matters"

[[gate]]
name = "committed-artifacts"
scope = "corpus"
kind = "verify-committed"   # glyph-schema, emoji-sheet, cluster-classes, emoji-corpus, engine-trie, atlas, fixtures
needs = []
compare = "each committed artifact rebuilt (scratch or generator check mode) vs its committed bytes"
blind_to = "whether the INPUTS are right — reproducibility, not truth"

[[gate]]
name = "vendor-hashes"
scope = "corpus"
kind = "cmd"
cmd = "python3 tools/vendor-manifest.py --check"
needs = []
compare = "every file in tools/vendor/SHA256SUMS vs its hash; hb.* also re-derived from their ref sources; third-party files also vs their recorded fetch hash"
blind_to = "upstream drift (by design) and a wrong-but-self-consistent vendored revision — the fixture corpus gate is the cover for the second"

[[gate]]
name = "cargo-build"
scope = "rust"
kind = "cargo"
cmd = "build"
needs = []
compare = "rustc warning count vs zero"

[[gate]]
name = "cargo-clippy"
scope = "rust"
kind = "cargo"
cmd = "clippy"
needs = []
compare = "clippy warning count vs zero"
blind_to = "anything silenced with #[allow(...)]"

[[gate]]
name = "cargo-doc"
scope = "rust"
kind = "cargo"
cmd = "doc"
needs = []
compare = "rustdoc warning count vs zero — intra-doc links resolve, HTML in prose is closed"
blind_to = "whether the prose is TRUE; it checks that every symbol a doc comment names still exists, not that the sentence around it is current"

[[gate]]
name = "cargo-test"
scope = "rust"
kind = "cargo-test"
needs = []
compare = "summed tests-actually-ran vs settings.test_floor ratchet; whole-binary dropout check"
blind_to = "nothing, structurally — that is what the floor is for. Holds the two corpus-size pins."

[[gate]]
name = "pick-oracle"
scope = "render"
kind = "cmd"
cmd = "bash tools/check-pick-oracle.sh"
pass_line = "ALL PASS"
needs = ["renderer"]
compare = "scripted picks and pixel-ray round trips vs an independent Python fold oracle"
blind_to = "pick paths outside the scripted set"

[[gate]]
name = "pixel-ab"
scope = "render"
kind = "golden-verify"
needs = ["renderer", "pixel-baselines"]
compare = "every declared golden_view re-rendered vs out/tooling-ab/baseline/<this host's --gpu-key>, byte-equal"
blind_to = "everything outside the declared frames; regression vs intentional change (re-baselining is a human act); any rasterizer other than this host's — a set proves nothing about another vendor"

# ── Declared mutations ───────────────────────────────────────────────────
# `glyph mutate` applies each of these, requires the named gate to go red
# with the named text, and restores byte-exact. A gate with no mutation is
# reported as uncovered — an unproven claim, not a passing one.
#
# ops: append (bytes onto the file) - replace (find -> with, first match) -
#      remove (move the file aside). The original bytes are snapshotted and
#      written back regardless of op, so restore is uniform and checkable.

[[mutation]]
name = "dead-input-glob"
gate = "manifest"
why = "a product input pattern matching NO file makes the currency stamp hash nothing of what it names, so `build` skips the build and `test --frozen` asserts currency over a stale binary. `native/src/**` was exactly this from 598205b until 2026-09-16 — glob's `**` matches directories, input_digest filters to files. CONSUMED BY: the product-input scan in validate(), and nothing else"
file = "build.toml"
op = "replace"
find = '"native/src/**/*"'
with = '"native/src/**"'
expect = "matches no file"

[[mutation]]
name = "corpus-shrink"
gate = "committed-artifacts"
why = "a generator case list losing an entry must not lower coverage silently"
file = "engine/fixtures/gen.mjs"
op = "replace"
expect = "declares 26"
with = ""
find = '''
    {
        name: 'wrap-emoji',
        bytes: utf8('a🚀b🌍cdef\nxy✨z✨✨\n🎉🎉🎉🎉'),
        items: [{ origin: { x: 0, y: 0, z: 0 }, wrapWidth: 3, zStep: 0.4, lineHeight: 1.2 }],
    },
'''

[[mutation]]
name = "committed-fixture-byte"
gate = "committed-artifacts"
why = "a committed fixture edited in place must not survive a scratch rebuild"
file = "engine/fixtures/ascii-basic.pipe.bin"
op = "append"
arg = " "
expect = "differs from the committed fixture"

[[mutation]]
name = "cluster-classes-byte"
gate = "committed-artifacts"
why = "the class table is generated from vendored UCD and a hand-edit must not survive; same class as emoji-sheet-byte, for the artifact every cluster-mode implementation reads"
file = "assets/atlas/cluster-classes.bin"
op = "append"
arg = " "
expect = "differs from a fresh bake"

[[mutation]]
name = "emoji-corpus-byte"
gate = "committed-artifacts"
why = "the demo corpus is generated from the shipped sequence table; a hand-edit to a corpus file must not survive a fresh bake, or the demo drifts from the table it claims to demonstrate"
file = "native/fixtures/emoji-corpus-small.txt"
op = "append"
arg = " "
expect = "differs from a fresh bake"

[[mutation]]
name = "emoji-sheet-byte"
gate = "committed-artifacts"
why = "a committed emoji sheet edited in place must not survive a rebuild from the font; the same class as committed-fixture-byte, for the artifact that is 10 MB of bytes nobody can eyeball"
file = "assets/atlas/emoji-sheet.bin"
op = "append"
arg = " "
expect = "emoji-sheet.bin differs from a fresh bake"

[[mutation]]
name = "vendored-file-edit"
gate = "vendor-hashes"
why = "a vendored oracle input edited in place must break its recorded hash"
file = "engine/fixtures/inputs/foldGeometry.js"
op = "append"
arg = "//m"
expect = "foldGeometry.js"

[[mutation]]
name = "third-party-font-edit"
gate = "vendor-hashes"
why = "the emoji sheet is rebuilt from this font; a font edited or re-vendored in place must break its recorded hash, or the sheet would be rebuilt from bytes nobody recorded. CONSUMED BY: the THIRD_PARTY set in vendor-manifest.py, which a file can be absent from while sitting on disk"
file = "tools/vendor/third-party/noto-emoji/NotoColorEmoji.ttf"
op = "append"
arg = " "
expect = "NotoColorEmoji.ttf"

[[mutation]]
name = "tests-silently-ignored"
gate = "cargo-test"
why = "tests that stop RUNNING must not read as coverage; #[ignore] is silent to rustc"
file = "native/src/glyph_trie.rs"
op = "replace"
find = '''    #[test]
'''
with = '''    #[test]
    #[ignore]
'''
expect = "Coverage DROPPED"



[[mutation]]
name = "unused-binding"
gate = "cargo-build"
why = "the zero-warning policy is enforced by our own warn_count parsing, not by rustc; a filter bug would let warnings through silently"
file = "native/src/fold.rs"
op = "replace"
find = """pub(crate) fn wrap_segment_of(col: i64, wrap: i64, terminator: bool) -> i64 {
"""
with = """pub(crate) fn wrap_segment_of(col: i64, wrap: i64, terminator: bool) -> i64 {
    let unread = col;
"""
expect = "cargo-build — 1 warnings"

[[mutation]]
name = "dead-doc-link"
gate = "cargo-doc"
why = "the defect this gate exists for, reproduced: a doc comment naming a symbol that no longer exists. It happened for real — `Engine::records` was renamed to `read_back` on 2026-09-07 and two links kept pointing at the old name through a full green battery, because nothing ran rustdoc. Distinct from every other Rust gate: build and clippy compile the CODE and never read the prose"
file = "native/src/layout.rs"
op = "replace"
find = "/// A layout backend. Bytes and params in, instances into the arena, placements"
with = "/// A layout backend, see [`GlyphArena::no_such_method`]. Bytes and params in, instances into the arena, placements"
expect = "FAIL  cargo-doc"
rebuild = "cargo build --release"

[[mutation]]
name = "clippy-lint"
gate = "cargo-clippy"
why = "same, for clippy: the gate counts lints itself and a counting bug would read as a clean tree"
file = "native/src/fold.rs"
op = "replace"
find = """pub(crate) fn wrap_segment_of(col: i64, wrap: i64, terminator: bool) -> i64 {
    if wrap <= 0 {
"""
with = """pub(crate) fn wrap_segment_of(col: i64, wrap: i64, terminator: bool) -> i64 {
    let v: Vec<i64> = Vec::new();
    if v.len() == 0 {}
    if wrap <= 0 {
"""
expect = "cargo-clippy — 2 warnings"



[[mutation]]
name = "coverage-scale"
gate = "pixel-ab"
why = "the golden views are the ONLY pixel check; a shader constant that changes glyph antialiasing must move them. Chosen because it is purely visual — it does not touch the fold, the corpus or CPU-side picking, so a red here is attributable to this gate and no other"
file = "crates/glyph-field-instanced/shaders/glyph_field.wgsl"
op = "replace"
find = "cov = clamp(coverage * 0.5, 0.0, 1.0);"
with = "cov = clamp(coverage * 0.62, 0.0, 1.0);"
expect = "text.png diverges from baseline"
rebuild = "cargo build --release"

[[mutation]]
name = "depth-write-off"
gate = "pixel-ab"
why = "the 2026-09-07 z-order defect put back: the glyph pass testing depth without writing it, so a later-drawn file paints over a nearer one. CONSUMED BY: repo-back-oblique, the frame added for it — and repo-wide, whose front-on column had been painting over long.md's pages in every baseline before that day without anyone seeing it"
file = "crates/glyph-field-instanced/src/pipeline.rs"
op = "replace"
find = """            // blends in exactly the order it did before.
            depth_write_enabled: Some(true),"""
with = """            // blends in exactly the order it did before.
            depth_write_enabled: Some(false),"""
expect = "repo-back-oblique.png diverges from baseline"
rebuild = "cargo build --release"

[[mutation]]
name = "emoji-uv-flip"
gate = "pixel-ab"
why = "the sheet sampled upside down — the class of defect the emoji frame exists for (a cell placement, inset or flip error), which no numeric gate can see because the layout is untouched. CONSUMED BY: emoji.png and nothing else; every text frame stays byte-equal under it, which is also the proof that no text frame samples the sheet"
file = "crates/glyph-field-instanced/shaders/glyph_field.wgsl"
op = "replace"
find = "        let t = vec2<f32>(c.x, 1.0 - c.y);"
with = "        let t = vec2<f32>(c.x, c.y);"
expect = "emoji.png diverges from baseline"
rebuild = "cargo build --release"

[[mutation]]
name = "cluster-static-zero-off"
gate = "pixel-ab"
why = "the invisible-by-design rule off: ZWJ / variation selectors / tags occupy full cells again — the sequence pass's fallback state moves, which is exactly what the emoji-cluster frame exists to see. CONSUMED BY: emoji-cluster.png's lone-zwj/VS16 line"
file = "native/src/text.rs"
op = "replace"
find = "            if crate::fold::is_static_zero_cp(cp) {"
with = "            if false && crate::fold::is_static_zero_cp(cp) {"
expect = "emoji-cluster.png diverges from baseline"
rebuild = "cargo build --release"



[[mutation]]
name = "pick-off-by-one"
gate = "pick-oracle"
why = "an off-by-one in the exact-match is the realistic pick defect: it resolves to the neighbouring glyph, which still looks like a plausible answer. Only an INDEPENDENT oracle can call it wrong, which is what this gate is for"
file = "native/src/glyph_scene/pick.rs"
op = "replace"
find = """            if r.row() == row {
                if r.col() == col {"""
with = """            if r.row() == row {
                if r.col() == col.wrapping_add(1) {"""
expect = "PICK ORACLE CHECK: FAILURES"
rebuild = "cargo build --release"


