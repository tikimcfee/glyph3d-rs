name = "copy-split-body-unaligned"
gate = "cargo-test"
why = "C16 (2026-10-09): a slot-buffer copy whose size is off 16 B runs whole at about half speed on the discrete path (RTX 5090/Vulkan measured; wgpu only asks for 4), so an odd Derived survivor count cost ~+20 ms of backend on the 94 MB tree across its two staging copies. Copying the whole size as the 'body' restores exactly that shape. Invisible to every byte and pixel gate BY DESIGN — the bytes that land are the same, only the speed moves — so the reddening witness is the helper's own unit test. CONSUMED BY: glyph_field::copy_split, called by the discrete staging copies in layout_hyper/device_alloc.rs and glyph-field-derived's upload"
file = "crates/glyph-field/src/copy.rs"
op = "replace"
find = "    let body = size - size % FAST_COPY_ALIGN;"
with = "    let body = size;"
expect = "split_body_is_fast_aligned_and_covers_the_size"
# cargo test --release builds the renderer bin too (integration tests), so
# without a restore rebuild prove would leave the MUTATED renderer in
# target/release under an unchanged input hash (found 2026-10-09).
rebuild = "cargo build --release"
