why = "a library region boxing only the ink on its pages, not the pages (2026-10-10): with regions on, each sheet's tree-cull box takes its page face (TreeCull::with_own_box), so a directory's box encloses the page faces you see; without it a box cuts through every page narrower than its file's content fit (and an empty file's page is boxed by nothing). The cull itself cannot see it (a box is only its prefilter). CONSUMED BY: TreeCull::fit for every sheet when setup.rs builds regions; reddens glyph_scene::regions::tests::region_boxes_are_the_tree_bounds_padded_through_drags_and_eases (its page-corner containment)"
file = "native/src/glyph_scene/tree_cull.rs"
op = "replace"
find = "        let mut b = if node.own { self.own_box } else { EMPTY };"
with = "        let mut b = if node.own { EMPTY } else { EMPTY };"
expect = "region_boxes_are_the_tree_bounds_padded_through_drags_and_eases"

[[mutation]]
name = "region-pick-outermost"
gate = "cargo-test"
why = "the region pick keeping the SHALLOWEST region the ray enters instead of the innermost (2026-10-10): a click inside a nested directory picks its top-level ancestor, so `g` drags the whole branch. CONSUMED BY: RegionTable::pick, behind every click that hits no file in a library with regions; reddens glyph_scene::regions::tests::the_region_pick_is_the_innermost_region_the_ray_enters"
file = "native/src/glyph_scene/regions.rs"
op = "replace"
find = "            if best.is_none_or(|(bd, bt, br)| depth > bd || (depth == bd && (tt < bt || (tt == bt && r > br)))) {"
with = "            if best.is_none_or(|(bd, bt, br)| depth < bd || (depth == bd && (tt < bt || (tt == bt && r > br)))) {"
expect = "the_region_pick_is_the_innermost_region_the_ray_enters"

[[mutation]]
name = "region-outpicks-content"
gate = "cargo-test"
why = "a library region answering a click before the files inside it (2026-10-10): the JS rule, kept here, is that content out-picks the box (the box only catches its empty interior), so a click on a page's text picks the file and a click in the margin picks the directory. With the region first, no file inside any region can be clicked. CONSUMED BY: GlyphScene::apply_pick's pixel arm (pick_ray, then pick_region_at on a miss); reddens tests/library_regions.rs regions_pick_after_content_and_draw_only_where_they_are (the release binary's pick lines)"
file = "native/src/glyph_scene/pick.rs"
op = "replace"
find = "            PickCommand::Pixel { x, y } => self.pick_ray(*x, *y),"
with = "            PickCommand::Pixel { x, y } => match self.pick_region_at(*x, *y) { Some(_) => None, None => self.pick_ray(*x, *y) },"
expect = "regions_pick_after_content_and_draw_only_where_they_are"

