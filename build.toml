# build.toml — the declarative build/verify graph for glyph3d-native.
#
# Consumed by `glyph` (glyph/src/, entry main.rs; `cargo glyph --help`). This file is
# the single account of WHICH artifacts exist, WHAT they are built from, and
# WHICH instruments run over them — the thing that used to live only as line
# order in tools/check-all.sh (a thin door onto `cargo glyph test` now). Root
# AGENTS.md ("What the checks actually do") explains what
# each gate compares, what makes it red, and what it cannot see; the per-gate
# `blind_to` lines below are one-line reminders, not the full account.
#
# Classes:
#   committed — tracked in git; verified by rebuilding to a scratch path and
#               byte-comparing (or by the generator's own check mode). `build`
#               regenerates them in place; that is a deliberate, committable act.
#   golden    — committed, but the tool can NEVER build them: the expected bytes
#               are a golden master that cannot be derived from declared inputs
#               (re-baselining is a human decision). Verify only.
#   product   — untracked build output. Nothing to compare against; it only has
#               to be CURRENT (input-content stamp) before anything reads it.
#
# Counts are DECLARED here, never derived from the tree being checked (the
# old fixture gate `ls`-counted the tree it was checking; a deleted fixture
# then lowered both sides of the comparison and stayed green).

[settings]
# Ratchet, NOT an equality: tests are added constantly, so an exact pin would
# redden on the most common good action in the repo. A green run whose real
# count exceeds the floor prints a NOTE naming the value to raise it to.
# Lowered 376 -> 374 on purpose (2026-10-26): the scene graph's GPU resolve
# was deleted with its five tests (GPU against CPU, its WGSL pins, the range
# coalescing) and three took their place (the frame resolve against the chain
# walk; the group table read back). Then 374 -> 383: frame.rs's ChunkRanges
# test and float_tables' eight. 384: the runner's dep-info parse (orphans);
# 385: the scheduler's waits; 387: warn_count over each tool's output and
# the doc gate's --workspace pin (test diet step 2); 388: apart_from as declared.
# Lowered 388 -> 341 on purpose (2026-10-26, test diet): scan.rs and bake.rs
# went with their twelve tests, the Visible field with its 33 (the crate's,
# the tests that held it to the device Pass 2, visible_verbs and
# visible_repeat), the line table with two (its whole-cells test moved to
# tab_stop.rs). Then 341 -> 342: prove_relax's routing test.
# 342 -> 346 (2026-10-26): the Derived host blocks' four (the block store's
# two, the blocks against the contiguous emission, the blocks against their
# buffers after every slot write). 346 -> 348 (2026-10-26): budget.rs's
# two (a load past the device or the host refused with its numbers).
# 348 -> 349: a host-drawn field keeps its blocks alone and edits them alike.
# 349 -> 350: on unified memory the host blocks and device copy are one demand.
# 350 -> 349 (2026-10-31): hyper_device_chunking_splits_and_binds_across_limits
# deleted with the device slot emission it tested (Instanced retirement).
# 349 -> 345 (2026-10-31): the glyph-field-instanced crate's four tests (three
# RenderSlot layout pins, one naga validation of its shader) went with it.
# 345 -> 343 (2026-10-31): copy.rs's two copy_split tests, deleted with the
# host-record upload path it served.
# 343 -> 345 (2026-10-31): prove_relax's two (the suite route runs the
# workspace's members alone; a mutant is overlaid for the members reading it).
# 345 -> 353 (2026-10-31): the C35/C36 work merged from the unpushed
# viz-native clone (2026-10-24): the analytic footprint's derivation and its
# Derived wgsl validation, the profile's footprint choice, the host-scoped
# mutation rule, the oblique repeat witness and the profiled offscreen run
# (there 386 -> 395, counted with the Instanced and Visible crates' share).
# 353 -> 377 (2026-10-31): the definition-engine crate's 24 (22 unit: spans
# and the word a tap selects, expansions, runs and their invariants, the
# store and its pending wait, the layers; 2 driving the `defn` binary
# through the whole loop).
# 377 -> 380 (2026-10-31): the host-placed texts' three
# (native/tests/text_scene.rs: offsets, refusals, a pick's text and byte
# from memory).
# 380 -> 384 (2026-10-31): the definition view's four (definition_engine::view:
# the loop by taps, the panels' estimated layout, card wrapping, taps on
# nothing).
# 384 -> 391 (2026-11-01): static dictionaries' seven (their sense split,
# inflections and cross-references, the store's dictionaries dir; a sense
# taken before any answer, in the run, the view and through the CLI).
# 391 -> 393 (2026-11-01): `glyph test --relax`'s two (its verdict is never a
# landing run; its flags parse as declared).
# 393 -> 394 (2026-11-01): VERB_HEADS against parse_verb, ported from the
# second clone's interface-shell branch (353 -> 354 on that branch).
# 394 -> 397: the window's three key-routing tests (app::key_tests), ported
# with route_key.
# 397 -> 398: --max-file-stacks reaches the session choice, ported with it.
# 398 -> 401 (2026-11-01): the build environment in the product stamp
# (build_env's two: the variables, the config files and their includes;
# products' one: the environment stales a product).
# 401 -> 403 (2026-11-01): the bounded device waits' two (a 1 ms wait on a
# busy dispatch panics naming the wait; [gpu] wait_timeout_secs overrides
# and is refused out of range).
# 403 -> 407 (2026-11-01): the runner's process limit's four (bounded.rs's
# two: a process past its limit is killed with everything under it, one
# inside it ends as it would have; gates.rs's two: a test binary past its
# limit is red by name with the tests it never finished and its output
# kept, and process_timeout_secs is declared and validated).
# 407 -> 409 (2026-11-01): the GPU test lock's two (gpu::test_device: the
# sections never overlap; init refuses a test thread without the lock).
test_floor = 409
# The longest any one process a gate runs may take, in seconds
# (2026-11-01, glyph/src/bounded.rs): each test binary cargo-test runs, each
# test target prove runs under relax, each golden render, each kind = "cmd"
# gate's command. Past it the process is killed with everything under it,
# the gate goes red naming it ("FAIL  <binary> timed out after N s", and
# the tests it never finished), and its output is kept under
# target/glyph-scratch/kept/ with, on Linux, its threads and a core dump's
# stacks. Until then nothing was bounded: on monolith1 on 2026-11-01 the
# renderer's unit-test binary stopped making progress four times in half an
# hour, and one run held the battery 353 s until killed by hand.
# Chosen against the slowest healthy runs seen: on monolith1 the whole
# cargo-test gate takes 6-24 s (the renderer's lib binary is the longest);
# on the M2 under load it took 44-76 s in full runs and once 205 s (an
# --inner run, load ~34), and under relax one target took 96 s. 600 is
# about three times the worst of those and still bounds a hang at ten
# minutes. The GPU's own waits panic first, at [gpu] wait_timeout_secs (60,
# config/defaults.toml), naming the wait.
process_timeout_secs = 600
# Every golden view is rendered again under each of these and must match the
# SAME baseline byte for byte (2026-10-09, C20). The plain frames render the
# Derived field, the default since 2026-10-11 (Instanced retirement step 1);
# until then they rendered Instanced and the Derived field was held here as
# `--field-mode derived` — the two render every golden frame identically
# (measured on vulkan-nvidia and metal-apple), which is why the default could
# move with no pixel moving. `--field-mode instanced` held the Instanced field
# byte-equal to the same frames from 2026-10-11 until its retirement
# (2026-10-31). `--field-mode visible` was an entry from 2026-10-10 until the
# Visible field was deleted (2026-10-26). None is declared today; a variant
# that must render the same frames lands here, and a view can be exempted
# from one (`[[golden_view.exempt]]`, rendered and reported, never judged)
# where it legitimately differs.
golden_equivalents = []
# The golden equivalents that run in the merge tier only (2026-10-26, test
# diet step 6): held byte-equal before every landing, not after every change.
# Each names a declared equivalent exactly; `glyph test --inner` prints each
# one it skips.
golden_equivalents_merge = []


# ── Products ─────────────────────────────────────────────────────────────

# The renderer's inputs are everything cargo compiles into the binary: its
# source, the workspace crates and config/ (every include_str!/include_bytes! resolves
# inside those trees; the atlas is read at RUN time, not compiled in), the
# root manifest (workspace members, [profile.release]), the root lockfile
# (dependency versions) and cargo config. Until 2026-10-09 this named
# `native/Cargo.lock`, gone since the workspace move (2026-09-06), and omitted
# the root two, so a dependency bump left the stamp unchanged and `--frozen`
# called a stale binary current (measured: lockfile edited, "renderer
# current"). validate() now refuses a literal input that names no file.
# Cargo also builds from what is NOT in the tree: the user's cargo config and
# what it includes (a host's build profile, .cargo/host.toml), CARGO_PROFILE_*
# and the other build variables, and the toolchain. Since 2026-11-01 every
# product's stamp hashes that build environment too (glyph/src/build_env.rs),
# so a profile changed outside the tree stales the product as an edit does.
[artifact.renderer]
class = "product"
outputs = ["target/release/glyph3d-native"]
# Built at WORKSPACE scope, as cargo-build and cargo-test then rebuild it:
# `cd native && cargo build` resolves features for this package alone, the
# workspace unifies them with glyph's (crypto-common/std, indexmap/default),
# and the two link different bytes. Until 2026-10-09 the stamp vouched for the
# package-scope binary and every gate after cargo-build ran the other one
# (measured: 62b55bfe vs 6dc7340c). Hence glyph/Cargo.toml as an input: its
# dependencies' features reach this binary. config/ holds the compiled-in
# settings defaults (main, 2026-10-09).
inputs = ["native/src/**/*", "native/Cargo.toml", "crates/**/*", "glyph/Cargo.toml", "config/**/*", "Cargo.toml", "Cargo.lock", ".cargo/config.toml"]
# The test binaries in the same invocation (2026-10-26): cargo-test needs
# them next, and one cargo compiles the renderer crate and its cfg(test)
# twin side by side rather than one after the other — 22 s against 17 + 15
# for a one-line edit in native/src, measured. The units are the same ones
# `cargo build --release` and `cargo test --release` make (both are fresh
# afterwards, measured), so the binary is the same bytes either way.
build = "cargo build --release --lib --bins --tests"
note = "Pure-Rust native renderer."

# ── Committed artifacts ──────────────────────────────────────────────────

# The colour-emoji sheet: the vendored font's PNG bytes verbatim plus the
# tables that name them, keyed by the font's glyph id. Every bitmap the font
# has is a cell, sequence-only ones included (out/EMOJI.md). Rebuilt from the
# font alone, offline; the check mode rebuilds in memory, byte-compares, and
# asserts the structure the renderer relies on.
[artifact.emoji-sheet]
class = "committed"
outputs = ["assets/atlas/emoji-sheet.bin"]
inputs = ["tools/vendor/third-party/noto-emoji/NotoColorEmoji.ttf", "tools/gen_emoji_sheet.py", "tools/emoji_font.py"]
build = "pixi run gen-emoji-sheet"
verify_cmd = "pixi run python tools/gen_emoji_sheet.py --check"
note = "Generator-native check mode; fontTools lives in the pixi env. The font is pinned by fetch hash in vendor-manifest.py."

[artifact.cluster-classes]
class = "committed"
outputs = ["assets/atlas/cluster-classes.bin"]
inputs = ["tools/gen_cluster_table.py", "tools/vendor/third-party/unicode-ucd/*.txt"]
build = "python3 tools/gen_cluster_table.py"
verify_cmd = "python3 tools/gen_cluster_table.py --check"
note = "Grapheme-cluster class table, generated from the vendored UCD (never hand-written). Carried verbatim into both tries for the general UAX #29 phase; the landed sequence pass reads no classes by design — tests are its only readers today."

# Regeneration is by hand and ORDERED: cluster-classes (from the vendored UCD)
# and emoji-sheet (from the vendored font) first — the atlas reads BOTH.
# (engine-trie.bin, re-containered from codepoints.bin for the retired engine
# and read by no Rust code, was retired 2026-10-09; its checks are the
# atlas-tables gate.)
# `glyph build` verifies these; it does not run the chain.
[artifact.atlas]
class = "committed"
outputs = ["assets/atlas/curves.bin", "assets/atlas/glyphmap.bin", "assets/atlas/glyphs.bin", "assets/atlas/codepoints.bin"]
inputs = ["tools/export-atlas.mjs", "tools/vendor/ref/**/*", "tools/vendor/hb.cjs", "tools/vendor/hb.wasm", "assets/atlas/emoji-sheet.bin", "assets/atlas/cluster-classes.bin"]
build = "node tools/export-atlas.mjs"
verify_scratch = "node tools/export-atlas.mjs --out {scratch}"
note = "No generator-native check mode; the runner rebuilds to scratch and cmps. Self-aborts before writing if fonts/ranges drift. Slots 0..4430 are the web bake verbatim; the emoji slots after them come from emoji-sheet.bin."

[artifact.fixtures]
class = "committed"
outputs = ["engine/fixtures/*.pipe.bin"]
inputs = ["engine/fixtures/gen.mjs", "engine/fixtures/inputs/**/*", "engine/glyph_schema.mjs"]
build = "cd engine/fixtures && node gen.mjs"
# Verified in a scratch COPY of engine/fixtures (+ ../glyph_schema.mjs, which
# gen.mjs imports) so the committed corpus is never deleted mid-check — the
# old gate deleted all 25 fixtures in place and restored them with git
# checkout. Counts are DECLARED, not ls-derived from the tree under test.
counts = { "pipe" = 26 }
note = "The Rust-side corpus pin (fixture.rs, 'update deliberately') stays; it and this declared count are two independent witnesses, not duplicates."

[artifact.glyph-schema]
class = "committed"
outputs = ["engine/glyph_schema.mjs"]
inputs = ["tools/gen_schema.py", "schema/glyph-identity.json"]
build = "python3 tools/gen_schema.py"
verify_cmd = "python3 tools/gen_schema.py --check"
note = "The fixture format lanes gen.mjs writes, generated from the schema; --check also runs the schema's own invariant validation. Ungated from the Mojo retirement until 2026-10-09: the generator still emitted a .mojo half whose committed file was gone, so --check was red and no artifact declared it."

[artifact.emoji-corpus]
class = "committed"
outputs = ["native/fixtures/emoji-corpus-small.txt", "native/fixtures/emoji-corpus-large.txt"]
inputs = ["tools/gen_emoji_corpus.py", "assets/atlas/codepoints.bin"]
build = "python3 tools/gen_emoji_corpus.py"
verify_cmd = "python3 tools/gen_emoji_corpus.py --check"
note = "The cluster demo corpus, generated from codepoints.bin's v2 sequence section: the large file carries every table sequence exactly once (asserted at bake), the small one is the one-line-per-class quick check. A demo asset, not a golden input — emoji-cluster/repo-cluster pin the mechanism; this pins the corpus against the table moving. --check-render (manual) diffs the renderer's staged counts against the generator's simulator."

# ── Goldens ──────────────────────────────────────────────────────────────
# Verified, NEVER built. These byte-equal screenshots are the only PIXEL
# gate, and the expected bytes cannot be derived from anything —
# re-rendering after a deliberate renderer change and committing the new
# PNGs is a human re-baseline act, done by hand, with a note in the commit.
# The tool refuses to regenerate them: no build command exists for this
# artifact, by design.
#
# ONE SET PER RASTERIZER. `{gpu}` is the key the renderer prints from
# `--gpu-key` (`<backend>-<vendor>`, e.g. metal-apple, vulkan-nvidia): the
# first Linux run (2026-09-07) showed NVIDIA's Vulkan rasterizer flips
# isolated edge pixels against Metal renders while every numeric gate stays
# bit-exact, so a golden set is a property of the hardware, not of the tree,
# and matching them across vendors is not a goal. Each set carries an
# ADAPTER.txt (`--gpu-profile`) naming the device and driver that made it;
# the gate prints a NOTE when the live adapter disagrees with the record. A
# host with no set for its key is red with the adoption commands printed —
# adopting is still by hand. `glyph drift` compares this host's renders
# against every OTHER set, so a cross-vendor difference that stops looking
# like edge noise is visible without being a gate.

[artifact.pixel-baselines]
class = "golden"
outputs = [
  "out/tooling-ab/baseline/{gpu}/demo.png",
  "out/tooling-ab/baseline/{gpu}/text.png",
  "out/tooling-ab/baseline/{gpu}/repo-zoom.png",
  "out/tooling-ab/baseline/{gpu}/repo-wide.png",
  "out/tooling-ab/baseline/{gpu}/repo-down.png",
  "out/tooling-ab/baseline/{gpu}/repo-back-oblique.png",
  "out/tooling-ab/baseline/{gpu}/emoji.png",
  "out/tooling-ab/baseline/{gpu}/emoji-cluster.png",
  "out/tooling-ab/baseline/{gpu}/repo-cluster.png",
  "out/tooling-ab/baseline/{gpu}/repo-highlight.png",
]
inputs = ["target/release/glyph3d-native", "native/fixtures/baseline-view.txt", "native/fixtures/emoji-view.txt", "native/fixtures/emoji-cluster-view.txt", "native/fixtures/g-pick-repo/**/*", "native/fixtures/g-cluster-repo/**/*", "native/fixtures/highlight-alpha.tsv", "assets/atlas/emoji-sheet.bin"]
note = "Blind to everything outside these frames, and cannot distinguish a regression from an intentional change. One set per rasterizer ({gpu}); a set only ever proves the renderer on the hardware that made it. empty.rs in g-pick-repo is zero bytes ON PURPOSE (the only input reaching the page-extent origin seed)."

# Per-view render commands (run from native/, screenshot into {scratch}).
[[golden_view]]
name = "demo"
cmd = "--demo --frames 2"
[[golden_view]]
name = "text"
cmd = "--render-file fixtures/baseline-view.txt --frames 2"
# The three repo views deliberately do NOT pin --repo-engine: they render on
# whatever the DEFAULT strategy is, because the default is what ships and the
# pixels are the only check that sees it end to end. The strategies are
# bit-exact, so these frames staying byte-equal across a default change is the
# proof that the change was safe — which is exactly what happened when `direct`
# became the default.
# repo-wide, -down, -zoom, -back-oblique and repo-cluster painted syntax
# (`--color-mode syntax`) until the heuristic's retirement (2026-10-11); they
# render flat in every mode now.
[[golden_view]]
name = "repo-wide"
cmd = "--load-repo fixtures/g-pick-repo --frames 2"
[[golden_view]]
name = "repo-down"
cmd = "--load-repo fixtures/g-pick-repo --frames 2 --wrap-mode down"
[[golden_view]]
name = "repo-zoom"
cmd = "--load-repo fixtures/g-pick-repo --frames 2 --focus-file alpha.rs --zoom 3"
# The z-order frame. Front-on views cannot see whether a wrapped column that
# recedes in `back` mode is occluded by the page beside it — that needs a
# camera pitched down over wide.txt so its column converges up into long.md.
# Added 2026-09-07 when exactly that was found wrong (the glyph pass tested
# depth without writing it, so draw order decided visibility). The
# `depth-write-off` mutation is what proves this frame sees the class.
[[golden_view]]
name = "repo-back-oblique"
cmd = "--load-repo fixtures/g-pick-repo --frames 2 --cam-pose 30 -120 60 0 -12"
# The colour-emoji frame (2026-09-10): every class of bitmap slot the trie has
# — web-era re-pointed, appended, no-cell, emoji-in-the-font-but-text-here —
# through `--render-file` (a one-item repo load since 2026-10-11; the CPU
# text stager before) and the shader's mode-1 branch. The only frame
# that samples the emoji sheet, so the only one that can see it; expect more
# cross-vendor drift here than on text (filtered sampling is not analytic
# coverage). `emoji-uv-flip` proves it reddens. It pins `--cluster-mode
# leader` by hand: since the 2026-09-22 default flip, the unpinned views all
# render cluster mode.
[[golden_view]]
name = "emoji"
cmd = "--render-file fixtures/emoji-view.txt --frames 2 --zoom 1.25 --cluster-mode leader"
# The sequence pass, through `--render-file` (HyperLayout's sequence pass
# since 2026-10-11, the text stager's before): cluster-mode rendering of every
# sequence class the trie resolves (families, flags, skin tones, keycaps, tag
# flags) plus the fallbacks (pieces for unlisted chains, zero-width ZWJ). Its
# leader twin is emoji.png, which KEEPS pinning leader mode — the fixture is
# immutable and the mode flag in its cmd is what makes the split explicit at
# the flip, whenever that comes.
[[golden_view]]
name = "emoji-cluster"
cmd = "--render-file fixtures/emoji-cluster-view.txt --frames 2 --zoom 1.25 --cluster-mode cluster"
# The repo-load twin: a tiny repo whose files carry the same classes through
# --load-repo (HyperLayout resolves them end to end; since 2026-10-11 so does
# emoji-cluster, one file at a time).
[[golden_view]]
name = "repo-cluster"
cmd = "--load-repo fixtures/g-cluster-repo --frames 2 --cluster-mode cluster"
# The highlight sidecar (2026-10-09) — the byte-range styling entry point the
# AST/LSP colouring will arrive through, which no frame had seen. alpha.rs
# whole: six spans recoloured, and every glyph no span covers written back
# at the default colour (style_file repaints the whole file — which is why
# the syntax paint this command asked for until 2026-10-11 never reached a
# pixel of this frame: it was byte-equal across the heuristic's retirement).
# It is the witness for C19
# (Derived placement edits zeroed the row and emptied this frame) — under the
# Derived equivalent until 2026-10-11, in the plain frame since Derived became
# the default; the IMMUTABLE sidecar is deliberately out of byte order, which
# is what found the sort the parser lacked.
[[golden_view]]
name = "repo-highlight"
cmd = "--load-repo fixtures/g-pick-repo --frames 2 --focus-file alpha.rs --zoom 1 --highlight fixtures/highlight-alpha.tsv"

# ── Gates ────────────────────────────────────────────────────────────────
# `scope` answers "I changed X, what should I run" — the question the CLI is
# organised around, rather than the twelve-item list this used to be:
#   rust    you touched native/, crates/ or glyph/
#   render  you touched layout, shaders, or anything that moves a pixel
#   corpus  you touched fixtures, generators, or vendored inputs
# `glyph test` with no scope runs all of them. `needs` lists artifacts that
# must be current/verified first; the order below satisfies them, and
# `validate` holds it to that. Names, not numbers — positions in this list
# have been renumbered twice already and a name survives renumbering.
#
# Since 2026-10-26 the gates run AT ONCE, each as a child `glyph gate`, and
# their output is printed in the order below as each one finishes. A gate
# waits only for an earlier gate that provides an artifact it needs, and
#   apart_from    gates this one never runs beside, where running together
#                 was measured to cost more than it saves (2026-10-26, on the
#                 32-core Linux host): pixel-ab and pick-oracle apart from
#                 cargo-test, whose GPU integration binaries slow a
#                 pixel-ab beside them from 7 s to 21 s (beside its CPU-
#                 bound unit tests alone, 10 s), so the overlap saved nothing
#                 (29 s against 28 s in turn). The two run beside each
#                 other. hyper-oracle was apart too until its Visible tier
#                 went (2026-10-26): CPU-only since, it runs beside
#                 cargo-test at no cost (0.5 s alone, 0.6-0.7 s beside it,
#                 cargo-test unchanged at 6.7 s; measured twice). No two gates
#                 share an output path (each scratch is its own). cargo's own
#                 lock orders the cargo gates sharing target/.
#   tier          `inner` is what `glyph test --inner` runs after each change;
#                 `merge` gates run only in a full `glyph test`, which runs
#                 every tier. The merge tier is the compiler's diagnostics —
#                 warnings, clippy, rustdoc, the no-default-features builds,
#                 orphan modules: they judge the code's form, not what it
#                 computes — and the corpus checks (committed artifacts, the
#                 atlas, vendored hashes), whose inputs a change to the
#                 renderer does not touch (test diet step 6, 2026-10-26).
#                 A full run before landing still answers them. Declared
#                 here, never decided at run time; a skipped gate is printed.

# First, because every gate below reads the map this checks. It is the only
# gate whose subject is build.toml itself: a manifest that lies makes each
# green beneath it a claim about something other than what it names.
[[gate]]
name = "manifest"
scope = "corpus"
tier = "inner"
kind = "cmd"
cmd = "target/release/glyph validate"
needs = []
compare = "build.toml against itself: every `needs` resolves and orders, every gate and mutation names a real target, every golden output is keyed by {gpu}, and every PRODUCT input, glob or literal, matches at least one file"
blind_to = "whether the declared inputs are the RIGHT ones — it proves a pattern matches something, never that it matches everything that matters"

[[gate]]
name = "committed-artifacts"
scope = "corpus"
tier = "merge"
kind = "verify-committed"   # glyph-schema, emoji-sheet, cluster-classes, emoji-corpus, atlas, fixtures
needs = []
compare = "each committed artifact rebuilt (scratch or generator check mode) vs its committed bytes"
blind_to = "whether the INPUTS are right — reproducibility, not truth"


[[gate]]
name = "atlas-tables"
scope = "corpus"
tier = "merge"
kind = "cmd"
cmd = "python3 tools/check_atlas.py"
pass_line = "ATLAS TABLES OK"
needs = []
compare = "codepoints.bin against glyphs.bin (magic, version, shape, upem, missing-block metrics, sequence slots = slotCount - sequences), pinned lookups ('A' 34, ' ' 1, RAT 3839, ROCKET 4759, TAG SPACE missing, the ZWJ family -> 6819), and every entry one em tall with block 0 the missing block"
blind_to = "any codepoint or sequence outside the pins: it proves the tables are self-consistent and right where pinned, not right everywhere. The font-unit -> world conversion is fu_to_world's unit test, not this. Committed-artifacts proves the bins are what they were; this proves what they MEAN where it can"
# The other half of the atlas's meaning: the curve and glyph-map textures,
# glyphs.bin against them, the trie's section layout and the sequence and
# class sections. tools/verify_atlas.py had asserted all of it since the export
# was written and was run by nothing (root AGENTS.md listed it as a blind spot
# until 2026-10-11). 0.14 s.
[[gate]]
name = "atlas-verify"
scope = "corpus"
tier = "merge"
kind = "cmd"
cmd = "python3 tools/verify_atlas.py"
pass_line = "VERIFY OK"
needs = []
