# build.toml — the declarative build/verify graph for glyph3d-native.
#
# Consumed by `glyph` (glyph/src/main.rs; `cargo glyph --help`). This file is
# the single account of WHICH artifacts exist, WHAT they are built from, and
# WHICH instruments run over them — the thing that used to live only as line
# order in tools/check-all.sh. Root AGENTS.md ("Verification") explains what
# each gate compares, what makes it red, and what it cannot see; the per-gate
# `blind_to` lines below are one-line reminders, not the full account.
#
# Classes:
#   committed — tracked in git; verified by rebuilding to a scratch path and
#               byte-comparing (or by the generator's own check mode). `build`
#               regenerates them in place; that is a deliberate, committable act.
#   golden    — committed, but the tool can NEVER build them: the expected bytes
#               are a golden master that cannot be derived from declared inputs
#               (re-baselining is a human decision). Verify only.
#   product   — untracked build output. Nothing to compare against; it only has
#               to be CURRENT (input-content stamp) before anything reads it.
#
# Counts are DECLARED here, never derived from the tree being checked (the
# old fixture gate `ls`-counted the tree it was checking; a deleted fixture
# then lowered both sides of the comparison and stayed green).

[settings]
# Ratchet, NOT an equality: tests are added constantly, so an exact pin would
# redden on the most common good action in the repo. A green run whose real
# count exceeds the floor prints a NOTE naming the value to raise it to.
test_floor = 93

# ── Products ─────────────────────────────────────────────────────────────

[artifact.dylib]
class = "product"
outputs = ["native/libglyph_engine.dylib"]
# `-I engine` makes the whole engine/ directory an input, generated schema
# included; pixi.toml/pixi.lock pin the toolchain itself.
inputs = ["engine/*.mojo", "pixi.toml", "pixi.lock"]
build = "pixi run build-engine"
note = "cargo does NOT build this; native/build.rs only links it. --fp-mode contract=off is load-bearing (FMA contraction breaks bit-exactness)."

[artifact.renderer]
class = "product"
outputs = ["target/release/glyph3d-native"]
inputs = ["native/src/**", "native/build.rs", "native/Cargo.toml", "native/Cargo.lock", "native/libglyph_engine.dylib"]
build = "cd native && cargo build --release"
note = "Cargo owns its own dependency graph; the stamp only guards the dylib edge cargo cannot see."

# ── Committed artifacts ──────────────────────────────────────────────────
# Two edges leave the schema, not one: the .mojo half feeds the dylib
# (`mojo -I engine`), the .mjs half feeds the fixture generators
# (engine/fixtures/gen.mjs imports ../glyph_schema.mjs). Editing
# schema/glyph-identity.json staleness-invalidates the CORPUS as well as
# the dylib.

[artifact.glyph-schema]
class = "committed"
outputs = ["engine/glyph_schema.mojo", "engine/glyph_schema.mjs"]
inputs = ["schema/glyph-identity.json", "tools/gen_schema.py"]
build = "python3 tools/gen_schema.py"
verify_cmd = "python3 tools/gen_schema.py --check"
note = "Generator-native check mode; also runs the schema's own tier validation."

[artifact.engine-trie]
class = "committed"
outputs = ["assets/atlas/engine-trie.bin"]
inputs = ["assets/atlas/glyphs.bin", "assets/atlas/codepoints.bin", "tools/gen_real_trie.py"]
build = "python3 tools/gen_real_trie.py"
verify_cmd = "python3 tools/gen_real_trie.py --verify-only"
note = "Check mode rebuilds and byte-compares without writing; its own sweeps pin the semantics."

[artifact.atlas]
class = "committed"
outputs = ["assets/atlas/curves.bin", "assets/atlas/glyphmap.bin", "assets/atlas/glyphs.bin", "assets/atlas/codepoints.bin"]
inputs = ["tools/export-atlas.mjs", "tools/vendor/ref/**", "tools/vendor/hb.cjs", "tools/vendor/hb.wasm"]
build = "node tools/export-atlas.mjs"
verify_scratch = "node tools/export-atlas.mjs --out {scratch}"
note = "No generator-native check mode; the runner rebuilds to scratch and cmps. Self-aborts before writing if fonts/ranges drift."

[artifact.fixtures]
class = "committed"
outputs = ["engine/fixtures/*.pipe.bin", "engine/fixtures/*.bake.bin"]
inputs = ["engine/fixtures/gen.mjs", "engine/fixtures/gen-bake.mjs", "engine/fixtures/inputs/**", "engine/glyph_schema.mjs"]
build = "cd engine/fixtures && node gen.mjs && node gen-bake.mjs"
# Verified in a scratch COPY of engine/fixtures (+ ../glyph_schema.mjs, which
# gen.mjs imports) so the committed corpus is never deleted mid-check — the
# old gate deleted all 25 fixtures in place and restored them with git
# checkout. Counts are DECLARED, not ls-derived from the tree under test.
counts = { "pipe" = 17, "bake" = 8 }
note = "The Rust-side corpus pins (fixture.rs / bake.rs, 'update deliberately') stay; they and these declared counts are two independent witnesses, not duplicates."

# ── Goldens ──────────────────────────────────────────────────────────────
# Verified, NEVER built. These four byte-equal screenshots are the only
# PIXEL gate, and the expected bytes cannot be derived from anything —
# re-rendering after a deliberate renderer change and committing the new
# PNGs is a human re-baseline act, done by hand, with a note in the commit.
# The tool refuses to regenerate them: no build command exists for this
# artifact, by design.

[artifact.pixel-baselines]
class = "golden"
outputs = [
  "out/tooling-ab/baseline/demo.png",
  "out/tooling-ab/baseline/text.png",
  "out/tooling-ab/baseline/repo-zoom.png",
  "out/tooling-ab/baseline/repo-wide.png",
  "out/tooling-ab/baseline/repo-down.png",
]
inputs = ["target/release/glyph3d-native", "native/fixtures/baseline-view.txt", "native/fixtures/g-pick-repo/**"]
note = "Blind to everything outside these four frames, and cannot distinguish a regression from an intentional change. empty.rs in g-pick-repo is zero bytes ON PURPOSE (the only input reaching the page-extent origin seed)."

# Per-view render commands (run from native/, screenshot into {scratch}).
[[golden_view]]
name = "demo"
cmd = "--demo --frames 2"
[[golden_view]]
name = "text"
cmd = "--render-file fixtures/baseline-view.txt --frames 2"
[[golden_view]]
name = "repo-wide"
cmd = "--load-repo fixtures/g-pick-repo --frames 2"
[[golden_view]]
name = "repo-down"
cmd = "--load-repo fixtures/g-pick-repo --frames 2 --wrap-mode down"
[[golden_view]]
name = "repo-zoom"
cmd = "--load-repo fixtures/g-pick-repo --frames 2 --focus-file alpha.rs --zoom 3"

# ── Gates ────────────────────────────────────────────────────────────────
# `scope` answers "I changed X, what should I run" — the question the CLI is
# organised around, rather than the twelve-item list this used to be:
#   engine  you touched engine/*.mojo or the FFI
#   rust    you touched native/src
#   render  you touched layout, shaders, or anything that moves a pixel
#   corpus  you touched fixtures, generators, or vendored inputs
# `glyph test` with no scope runs all of them, in the order below.
# The battery `glyph check` runs, in order. `needs` lists artifacts that must
# be current/verified first; the runner enforces the order below, which
# satisfies them. Names, not numbers — positions in this list have been
# renumbered twice already and a name survives renumbering.

[[gate]]
name = "committed-artifacts"
scope = "corpus"
kind = "verify-committed"   # glyph-schema, engine-trie, atlas, fixtures
needs = []
compare = "each committed artifact rebuilt (scratch or generator check mode) vs its committed bytes"
blind_to = "whether the INPUTS are right — reproducibility, not truth"

[[gate]]
name = "vendor-hashes"
scope = "corpus"
kind = "cmd"
cmd = "python3 tools/vendor-manifest.py --check"
needs = []
compare = "22 vendored+derived files vs tools/vendor/SHA256SUMS; hb.* also re-derived from their ref sources"
blind_to = "upstream drift (by design) and a wrong-but-self-consistent vendored revision — the fixture corpus gate is the cover for the second"

[[gate]]
name = "engine-suites"
scope = "engine"
kind = "cmd"
cmd = "./engine/check.sh all"
needs = ["fixtures"]
compare = "16 Mojo conformance suites + ffi_selftest + 3 instruments vs the fixture corpus, CPU and Metal"
blind_to = "faults shared by the serial and scan forms in conformance_real (oracle-free by design); the instruments print but assert nothing"

[[gate]]
name = "cargo-build"
scope = "rust"
kind = "cargo"
cmd = "build"
needs = ["dylib"]
compare = "rustc warning count vs zero"

[[gate]]
name = "cargo-clippy"
scope = "rust"
kind = "cargo"
cmd = "clippy"
needs = []
compare = "clippy warning count vs zero"
blind_to = "anything silenced with #[allow(...)]"

[[gate]]
name = "cargo-test"
scope = "rust"
kind = "cargo-test"
needs = []
compare = "summed tests-actually-ran vs settings.test_floor ratchet; whole-binary dropout check"
blind_to = "nothing, structurally — that is what the floor is for. Holds the two corpus-size pins."

[[gate]]
name = "engine-check"
scope = "engine"
kind = "engine-check"
# Two inputs, declared here rather than in the runner. src/main.rs is
# well-formed UTF-8 by construction and can never reach the out-of-range decode
# path where the two implementations actually disagreed; overflow-leads.txt is
# the only input in the tree that does.
targets = ["src/main.rs", "fixtures/overflow-leads.txt"]
needs = ["renderer", "dylib"]
compare = "Mojo engine through the FFI vs an independent Rust CPU fold, record by record"
blind_to = "the per-item FFI strategy (hardcodes batched) and malformed shapes other than overflow-leads"

[[gate]]
name = "pick-oracle"
scope = "render"
kind = "cmd"
cmd = "bash tools/check-pick-oracle.sh"
pass_line = "ALL PASS"
needs = ["renderer"]
compare = "scripted picks and pixel-ray round trips vs an independent Python fold oracle"
blind_to = "pick paths outside the scripted set"

[[gate]]
name = "pixel-ab"
scope = "render"
kind = "golden-verify"
needs = ["renderer", "pixel-baselines"]
compare = "four views re-rendered vs out/tooling-ab/baseline, byte-equal"
blind_to = "everything outside the four frames; regression vs intentional change (re-baselining is a human act)"

[[gate]]
name = "repo-verify"
scope = "engine"
kind = "repo-verify"
# --repo-scan-only is LOAD-BEARING: without it this opens the windowed
# renderer and never returns. Run per wrap mode; {mode} is substituted.
cmd = "--load-repo fixtures/g-pick-repo --wrap-mode {mode} --repo-verify --repo-scan-only"
modes = ["down", "back"]
needs = ["renderer", "dylib"]
compare = "per-item vs batched FFI strategies, bit-exact at the layout seam, both wrap modes"
blind_to = "a fault BOTH strategies share — ground truth comes from engine-check, batched path only"

[[gate]]
name = "repo-verify-direct"
scope = "engine"
kind = "repo-verify"
# The direct path has no wire record, so this diff is placements + instances
# only — the whole render-visible contract, and the granularity that matters.
# It is a SEPARATE gate rather than another mode of the one above because it
# compares a different pair and is blind to different things, and a gate whose
# `compare` line has to say "and sometimes this other thing" is two gates.
cmd = "--load-repo fixtures/g-pick-repo --wrap-mode {mode} --repo-engine direct --repo-verify --repo-scan-only"
modes = ["down", "back"]
needs = ["renderer", "dylib"]
compare = "the direct instance writer vs the batched record path, bit-exact on placements and instances, both wrap modes"
blind_to = "the 32 B wire record tier, which the direct path does not produce — record-level faults are covered by repo-verify and engine-check"

[[gate]]
name = "reference-port"
scope = "corpus"
kind = "cmd"
cmd = "tools/check-fixture-parity.sh"
needs = ["renderer", "fixtures"]
compare = "six halves vs the JS oracle's recorded answers: parse parity, trie, fold, scan, bake, text.rs domain"
blind_to = "a fault shared by both loaders in parse parity; any fixture outside text.rs's domain, silently"

# ── Declared mutations ───────────────────────────────────────────────────
# `glyph mutate` applies each of these, requires the named gate to go red
# with the named text, and restores byte-exact. A gate with no mutation is
# reported as uncovered — an unproven claim, not a passing one.
#
# ops: append (bytes onto the file) - replace (find -> with, first match) -
#      remove (move the file aside). The original bytes are snapshotted and
#      written back regardless of op, so restore is uniform and checkable.

[[mutation]]
name = "corpus-shrink"
gate = "committed-artifacts"
why = "a generator case list losing an entry must not lower coverage silently"
file = "engine/fixtures/gen.mjs"
op = "replace"
expect = "declares 17"
with = ""
find = '''
    {
        name: 'wrap-emoji',
        bytes: utf8('a🚀b🌍cdef\nxy✨z✨✨\n🎉🎉🎉🎉'),
        items: [{ origin: { x: 0, y: 0, z: 0 }, wrapWidth: 3, zStep: 0.4, lineHeight: 1.2 }],
    },
'''

[[mutation]]
name = "committed-fixture-byte"
gate = "committed-artifacts"
why = "a committed fixture edited in place must not survive a scratch rebuild"
file = "engine/fixtures/ascii-basic.pipe.bin"
op = "append"
arg = " "
expect = "differs from the committed fixture"

[[mutation]]
name = "vendored-file-edit"
gate = "vendor-hashes"
why = "a vendored oracle input edited in place must break its recorded hash"
file = "engine/fixtures/inputs/foldGeometry.js"
op = "append"
arg = "//m"
expect = "foldGeometry.js"

[[mutation]]
name = "tests-silently-ignored"
gate = "cargo-test"
why = "tests that stop RUNNING must not read as coverage; #[ignore] is silent to rustc"
file = "native/src/glyph_trie.rs"
op = "replace"
find = '''    #[test]
'''
with = '''    #[test]
    #[ignore]
'''
expect = "Coverage DROPPED"

# ── engine-suites and engine-check ───────────────────────────────────────
# `rebuild` is MANDATORY for anything the dylib is built from: engine/check.sh
# re-links it mid-gate, so without the post-restore rebuild the tree comes back
# byte-exact with a MUTATED dylib still sitting at native/libglyph_engine.dylib
# — cargo does not build that file, so the next gate would test the wrong binary.
#
# Each of these was checked against the third outcome, the one that is neither
# "landed" nor "failed to land": LANDED IN A REGION NOTHING READS. The named
# consumer is recorded in each `why`.

[[mutation]]
name = "phantom-row"
gate = "engine-suites"
why = "the 2026-09-04 phantom row: a wrap rule that counts the terminating newline's own row steals a blank row whenever wrap divides the line length exactly, and the two rules agree at every other length. CONSUMED BY: wrap-exact (lines of 4/8/12 at wrap 4 — the fixture exists for this), wrap-emoji and real-kernels; 3 of 17 cases, 178,916 mismatches."
file = "engine/glyph_pipeline.mojo"
rebuild = "pixi run build-engine"
op = "replace"
find = "    return (length - 1) // wrap + 1"
with = "    return length // wrap + 1"
expect = "conformance: 3 case(s) failed"

[[mutation]]
name = "ord-f32-carrier"
gate = "engine-suites"
why = "the f32 ordinal wall put back. A CORRELATED fault: both the port and the oracle computed ord exactly and quantized on the store, so past 2^24 they rounded together and the differ said PASS. CONSUMED BY: ordinal_invariant's synthetic 2^24+2 boundary probe ONLY — every one of the 17 fixtures stays green under this, and so do conformance and conformance_scan (verified). This mutation is the reason that suite is not decorative."
file = "engine/glyph_pipeline.mojo"
rebuild = "pixi run build-engine"
op = "replace"
find = "            w.wc[unsafe_offset=id] = UInt32(ord)"
with = "            w.wc[unsafe_offset=id] = UInt32(Int(Float32(ord)))"
expect = "the migration is incomplete"

[[mutation]]
name = "abi-shape-drift"
gate = "engine-suites"
why = "the descriptor's i32 arity moves on the ENGINE side while a foreign caller keeps pinning the old shape — the 2026-09-04 positional-arity incident, the thing ABI_SHAPE exists to refuse. CONSUMED BY: ffi_selftest, which restates the ABI literally instead of importing it and links the SHIPPED dylib; every load_item_desc call is then refused with GE_ABI_MISMATCH (9). Nothing else in the battery crosses the real C ABI for the single-item entry."
file = "engine/ffi.mojo"
rebuild = "pixi run build-engine"
op = "replace"
find = "comptime ABI_DESC_I32S: Int = 7                # i32 params inside that block"
with = "comptime ABI_DESC_I32S: Int = 6                # i32 params inside that block"
expect = "load_item status 9"

[[mutation]]
name = "out-of-range-block"
gate = "engine-check"
why = "an out-of-range codepoint must resolve to the SHARED MISSING BLOCK (storage block 0); resolving it to a real block is the September 2026 disagreement between this engine and the Rust reference, which asserted instead. CONSUMED BY: fixtures/overflow-leads.txt and NOTHING ELSE — 4 of its 15 records differ (GID 189 vs 0). src/main.rs stays green under this mutation, which is exactly why engine-check runs two inputs; so does the whole engine-suites battery, since no fixture carries an F5-F7 lead byte."
file = "engine/glyph_pipeline.mojo"
rebuild = "pixi run build-engine"
op = "replace"
find = """
        block = 0
    var entry"""
with = """
        block = 1
    var entry"""
expect = "FAIL  engine-check (fixtures/overflow-leads.txt)"

[[mutation]]
name = "unused-binding"
gate = "cargo-build"
why = "the zero-warning policy is enforced by our own warn_count parsing, not by rustc; a filter bug would let warnings through silently"
file = "native/src/fold.rs"
op = "replace"
find = """pub(crate) fn wrap_segment_of(col: i64, wrap: i64, terminator: bool) -> i64 {
"""
with = """pub(crate) fn wrap_segment_of(col: i64, wrap: i64, terminator: bool) -> i64 {
    let unread = col;
"""
expect = "cargo-build — 1 warnings"

[[mutation]]
name = "clippy-lint"
gate = "cargo-clippy"
why = "same, for clippy: the gate counts lints itself and a counting bug would read as a clean tree"
file = "native/src/fold.rs"
op = "replace"
find = """pub(crate) fn wrap_segment_of(col: i64, wrap: i64, terminator: bool) -> i64 {
    if wrap <= 0 {
"""
with = """pub(crate) fn wrap_segment_of(col: i64, wrap: i64, terminator: bool) -> i64 {
    let v: Vec<i64> = Vec::new();
    if v.len() == 0 {}
    if wrap <= 0 {
"""
expect = "cargo-clippy — 2 warnings"

[[mutation]]
name = "advance-zeroed"
gate = "reference-port"
why = "every glyph x-position derives from the atlas advance; zeroing it must break the port's agreement with the JS oracle's recorded lanes. cargo-mutants measured this exact mutant as MISSED by all 85 unit tests"
file = "native/src/fold.rs"
op = "replace"
find = """    pub fn advance(&self, id: usize) -> f32 {
        self.sm[id * 2]
    }"""
with = """    pub fn advance(&self, id: usize) -> f32 {
        let _ = id;
        0.0
    }"""
expect = "full fold"
rebuild = "cargo build --release"

[[mutation]]
name = "coverage-scale"
gate = "pixel-ab"
why = "the four baselines are the ONLY pixel check; a shader constant that changes glyph antialiasing must move them. Chosen because it is purely visual — it does not touch the fold, the corpus or CPU-side picking, so a red here is attributable to this gate and no other"
file = "native/src/shaders/glyph_field.wgsl"
op = "replace"
find = "let cov = clamp(coverage * 0.5, 0.0, 1.0);"
with = "let cov = clamp(coverage * 0.62, 0.0, 1.0);"
expect = "text.png diverges from baseline"
rebuild = "cargo build --release"

[[mutation]]
name = "per-item-group-drift"
gate = "repo-verify"
why = "this gate is strategy-vs-strategy: its whole claim is that the per-item and batched FFI paths agree. Perturbing ONE path must break that. The per-item branch is exercised by no other gate (engine-check hardcodes batched), so a red here is attributable to this check alone"
file = "native/src/layout_mojo.rs"
op = "replace"
find = """                    placements.push(compact_records_into(
                        &records,
                        item.paint,
                        item.group_id,
                        arena,
                    ));"""
with = """                    placements.push(compact_records_into(
                        &records,
                        item.paint,
                        item.group_id.wrapping_add(1),
                        arena,
                    ));"""
expect = "FAIL  --wrap-mode down"
rebuild = "cargo build --release"

[[mutation]]
name = "direct-ink-half-height"
gate = "repo-verify-direct"
why = "the direct writer recomputes the ink extent that compact_records_into computes on the record path — the same arithmetic in a second language, which is exactly the correlated-fault risk this gate exists to close. Perturbing the half-height moves ink and nothing else, so a red is attributable to the extent comparison rather than to instance bytes"
file = "engine/glyph_record.mojo"
op = "replace"
find = "        var half = hgt * 0.5"
with = "        var half = hgt * 0.4"
expect = "FAIL  --wrap-mode down"
rebuild = "pixi run build-engine"

[[mutation]]
name = "direct-prefix-counts-records"
gate = "repo-verify-direct"
why = "the grained write is a scan/scatter, and its core invariant is that the slot prefix advances by SURVIVORS while the paint prefix advances by RECORDS. Advancing slots by records instead leaves gaps of uninitialized arena between grains — the exact defect grains introduce and the one direct-ink-half-height cannot see, since that mutation reddens under the serial writer too. Distinct from every other mutation here: it perturbs the parallel decomposition, not the arithmetic"
file = "engine/glyph_record.mojo"
op = "replace"
find = "        slot_at += gr_surv[t]"
with = "        slot_at += gr_rec[t]"
expect = "FAIL  --wrap-mode down"
rebuild = "pixi run build-engine"

[[mutation]]
name = "pick-off-by-one"
gate = "pick-oracle"
why = "an off-by-one in the exact-match is the realistic pick defect: it resolves to the neighbouring glyph, which still looks like a plausible answer. Only an INDEPENDENT oracle can call it wrong, which is what this gate is for"
file = "native/src/glyph_scene.rs"
op = "replace"
find = """            if r.row() == row {
                if r.col() == col {"""
with = """            if r.row() == row {
                if r.col() == col.wrapping_add(1) {"""
expect = "PICK ORACLE CHECK: FAILURES"
rebuild = "cargo build --release"
